function fmtWindow(a,b){
  if(!a||!b) return a?fmt(a):"";
  const A=sd(a), B=sd(b), M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const lastOf=d=>new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  if(A.getDate()===1 && B.getDate()===lastOf(B))
    return M[A.getMonth()]+(A.getMonth()!==B.getMonth()||A.getFullYear()!==B.getFullYear()?"\u2013"+M[B.getMonth()]:"")+" "+B.getFullYear();
  return M[A.getMonth()]+" "+A.getDate()+"\u2013"+(A.getMonth()!==B.getMonth()?M[B.getMonth()]+" ":"")+B.getDate();
}
function statusOf(j){
  const m=j._meta||{};
  if(j.inProgress) return ["In progress","pill mut"];
  if(m.variance==null) return ["Not scheduled","pill mut"];
  if(j.windowEnd){
    const late=m.windowLate||0;
    if(late===0 && m.plannedStart && j.windowStart && m.plannedStart<j.windowStart) return ["Ahead of window","pill ok"];
    if(late===0) return ["In window","pill ok"];
    if(late<=14) return ["+"+late+"d past window","pill warn"];
    return ["+"+late+"d past window","pill bad"];
  }
  if(m.variance<=3) return ["On target","pill ok"];
  if(m.variance<=14) return ["At risk","pill warn"];
  return ["Conflict","pill bad"];
}
// Next open starts per type, worked out in the background and cached until the schedule changes.
function nextOpenStarts(type){
  App._nextCache=App._nextCache||{};
  const c=App._nextCache[type];
  if(c && c.sched===App.sched) return c;
  const entry={sched:App.sched, list:null, busy:true};
  App._nextCache[type]=entry;
  setTimeout(()=>{
    try{ entry.list=findOpenSlots(type, App.staged.jobs, App.staged.cfg, App._blocked, App.staged.crew||{}, App._cold, 3); }
    catch(e){ console.error(e); entry.list=[]; }
    entry.busy=false;
    if(App.tab==="pipeline" && App._nextCache[type]===entry) render();
  }, type==="vinyl"?30:60);
  return entry;
}

async function retireJob(id){
  // Finished pools leave the schedule but keep their record. Saved straight away.
  const j=App.staged.jobs.find(x=>x.id===id); if(!j) return;
  if(!confirm("Mark "+j.name+" complete and take it off the schedule?")) return;
  const when=todayStr();
  App.staged.jobs=App.staged.jobs.filter(x=>x.id!==id);
  App.committed.jobs=App.committed.jobs.filter(x=>x.id!==id);
  App.archived.push(Object.assign({},j,{status:"archived",archivedAt:when}));
  recompute(); render();
  if(App.db){ try{ await App.db.doc("jobs/"+id).update({status:"archived",archivedAt:when}); toast(j.name+" retired"); }
    catch(e){ toast("Could not save that"); } }
}
async function restoreJob(id){
  const j=App.archived.find(x=>x.id===id); if(!j) return;
  App.archived=App.archived.filter(x=>x.id!==id);
  const back=Object.assign({},j); delete back.status; delete back.archivedAt;
  App.staged.jobs.push(clone(back)); App.committed.jobs.push(clone(back));
  recompute(); render();
  if(App.db){ try{ await App.db.doc("jobs/"+id).update({status:"active"}); toast(j.name+" restored"); }
    catch(e){ toast("Could not save that"); } }
}

// renovation steps are typed one per line:  name | days | men | flags
// flags (optional, comma separated): concrete, next, sub, inspection, plaster, liner
function parseSteps(txt){
  return String(txt||"").split(/\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
    const p=l.split("|").map(x=>x.trim());
    const fl=(p[3]||"").toLowerCase();
    const st={t:p[0], d:+(p[1]||1)||1, m:+(p[2]||0)||0};
    if(/concrete|pour/.test(fl)) st.w="CONCRETE";
    if(/plaster/.test(fl)) st.w="PLASTER";
    if(/liner/.test(fl)) st.w="LINER";
    if(/next/.test(fl)) st.next=1;
    if(/sub/.test(fl)) st.c="SUB";
    if(/inspect/.test(fl)) st.c="INSPECT";
    return st;
  });
}
function stepsText(steps){
  return (steps||[]).map(st=>{
    const fl=[]; if(st.w==="CONCRETE") fl.push("concrete"); if(st.w==="PLASTER") fl.push("plaster");
    if(st.w==="LINER") fl.push("liner"); if(st.next) fl.push("next");
    if(st.c==="SUB") fl.push("sub"); if(st.c==="INSPECT") fl.push("inspection");
    return st.t+" | "+st.d+" | "+st.m+(fl.length?" | "+fl.join(", "):"");
  }).join("\n");
}

/* ---------- ONE-OFF TASKS: crew time not tied to a pool ---------- */
function openOneOff(id){
  const isNew=!id;
  const j = isNew ? {id:"o"+Date.now().toString(36), type:"oneoff", name:"", task:"", date:todayStr(),
                     d:1, m:2, color:"#5F6B73", order:0}
                  : clone(jobById(id));
  const scrim=el("div","scrim"); const m=el("div","modal");
  const h=el("div","mhead"); h.appendChild(el("h3",null,isNew?"Add a one-off task":"Edit one-off task"));
  h.appendChild(el("div","grow"));
  const x=el("button","btn sm ghost","Close"); x.onclick=()=>scrim.remove(); h.appendChild(x);
  m.appendChild(h);
  const b=el("div","mbody");
  b.appendChild(el("p","note","Crew time for anything that is not a pool: a service call, a shop day, a delivery. "+
    "It holds those men on that day, the pools work around it, and it prints on the crew sheet."));
  const g=el("div","fgrid");
  const mkf=(label,node)=>{const l=el("label","f"); l.appendChild(el("span",null,label)); l.appendChild(node); return l;};
  const nI=el("input"); nI.value=j.name; nI.placeholder="What it is, for example Shop day: pool kits";
  const dI=el("input"); dI.type="date"; dI.value=j.date||todayStr();
  const mI=el("input"); mI.type="number"; mI.min="1"; mI.step="1"; mI.value=j.m||2;
  const lS=el("select");
  [[0.5,"Half day"],[1,"1 day"],[1.5,"1\u00bd days"],[2,"2 days"],[3,"3 days"],[4,"4 days"],[5,"5 days"]].forEach(([v,t])=>{
    const o=document.createElement("option"); o.value=v; o.textContent=t; lS.appendChild(o); });
  lS.value=String(j.d||1);
  g.append(mkf("What",nI),mkf("Day (starts)",dI),mkf("Men",mI),mkf("How long",lS));
  b.appendChild(g); m.appendChild(b);
  const f=el("div","mfoot");
  if(!isNew){
    const del=el("button","btn","Remove"); del.style.marginRight="auto";
    del.onclick=()=>{ App.staged.jobs=App.staged.jobs.filter(q=>q.id!==id); recompute(); scrim.remove(); render();
      toast("Removed. Review and approve to save."); };
    f.appendChild(del);
  }
  const cancel=el("button","btn","Cancel"); cancel.onclick=()=>scrim.remove();
  const save=el("button","btn primary",isNew?"Add and rebuild":"Save and rebuild");
  save.onclick=()=>{
    if(!nI.value.trim()){ nI.focus(); toast("Say what the task is"); return; }
    const w=sd(dI.value).getDay();
    if(w===0||w===6){ toast("Pick a weekday"); return; }
    j.name=nI.value.trim(); j.task=j.name; j.date=dI.value; j.targetStart=dI.value;
    j.m=Math.max(1,+mI.value||1); j.d=+lS.value||1;
    j.force={}; j.force[j.task]=j.date;
    const i=jobIdx(j.id);
    if(i<0) App.staged.jobs.push(j); else App.staged.jobs[i]=j;
    recompute(); scrim.remove(); render();
    toast("Added. Review and approve to save.");
  };
  f.append(cancel,save); m.appendChild(f); scrim.appendChild(m);
  scrim.onclick=e=>{ if(e.target===scrim) scrim.remove(); };
  document.body.appendChild(scrim);
}

/* ---------- SCHEDULE: one pool at a time, in plain order ---------- */
function viewSchedule(){
  const v=document.createElement("div");
  v.appendChild(el("h2",null,"Job progress"));
  v.appendChild(el("p","sub","One pool at a time, every step in build order. Use this to see where a job stands and what is next, not to plan the week. The Board is for the week."));

  const jobs=App.staged.jobs.filter(isPool);
  if(!jobs.length){ v.appendChild(el("p","note","No pools yet.")); return v; }
  if(!App._filter || !jobs.some(j=>j.id===App._filter)) App._filter=jobs[0].id;

  const ctl=el("div","boardctl");
  const sel=el("select");
  sel.style.cssText="padding:7px 9px;border:1px solid var(--rule);border-radius:4px;"+
    "background:var(--surface);font-weight:600;min-width:180px";
  sel.innerHTML=jobs.map(j=>"<option value='"+esc(j.id)+"'>"+esc(j.name)+"</option>").join("");
  sel.value=App._filter;
  sel.onchange=()=>{App._filter=sel.value; render();};
  ctl.appendChild(sel);
  ctl.appendChild(el("div","grow"));
  if(App.canEdit){
    const ed=el("button","btn sm","Edit this pool");
    ed.onclick=()=>openJob(App._filter); ctl.appendChild(ed);
  }
  if(App.dl){ const ex=el("button","btn sm","Export all to CSV"); ex.onclick=exportCSV; ctl.appendChild(ex); }
  v.appendChild(ctl);

  const j=jobById(App._filter), m=j._meta||{}, p=promiseFor(j);
  const rows=App.sched.rows.filter(r=>r.jobId===j.id);
  const done=rows.filter(r=>r.cat==="DONE").length;
  const total=rows.filter(r=>r.cat!=="HOLD").length;
  const next=rows.find(r=>r.cat!=="DONE"&&r.cat!=="HOLD"&&r.start&&diffD(r.finish,todayStr())>=0);
  const [rlab,rcls]=finishRisk(j);

  const head=el("div","card");
  head.appendChild(el("h3",null,j.name+"  \u2014  "+(j.type==="gunite"?"Plaster / gunite":typeLabel(j))+
    (j.autoCover?", auto cover":"")));
  const facts=el("div","fgrid");
  const box=(label,value,color)=>{
    const d=el("div");
    d.style.cssText="border:1px solid var(--rule2);border-radius:4px;padding:7px 9px";
    const l=el("div",null,label);
    l.style.cssText="font-size:11.5px;color:var(--slate);font-weight:600";
    const x=el("div",null,value);
    x.style.cssText="font-size:15px;font-weight:700"+(color?";color:"+color:"");
    d.append(l,x); return d;
  };
  facts.append(
    box("Steps complete", done+" of "+total),
    box("Working on now", next?next.task:"Nothing scheduled"),
    box("Started", m.plannedStart?fmtY(m.plannedStart):"Not yet"),
    box("Finishes", m.plannedFinish?fmtY(m.plannedFinish):"\u2014"),
    box("Customer hears", p.plain?fmtY(p.plain):"\u2014", p.gapFlag>0?"var(--dig)":""),
    box("Contract due", p.due?fmtY(p.due):"\u2014", p.overFlag>0?"var(--oxide)":"")
  );
  head.appendChild(facts);
  const rp=el("p"); rp.style.cssText="margin:10px 0 0;font-size:13.5px";
  rp.innerHTML="<span class='"+rcls+"'>"+esc(rlab||"No date yet")+"</span>  "+
    (p.delay?("<span style='color:var(--slate)'>"+p.delay+" delay days logged, earning "+
      p.ext+" days of extension.</span>"):"<span style='color:var(--slate)'>No delay days logged yet.</span>")+
    (p.wx>0?"<br><span style='color:var(--slate)'>Parked "+p.wx+" days waiting for the liner or plaster season. "+
      "That is weather, so it is not counted as a delay.</span>":"");
  head.appendChild(rp);
  v.appendChild(head);

  const draws=rows.filter(r=>r.tpl&&r.tpl.draw).sort((a,b)=>a.tpl.draw-b.tpl.draw);
  if(draws.length){
    const dc=el("div","card");
    dc.appendChild(el("h3",null,"Payments"));
    const dg=el("div","fgrid");
    draws.forEach(r=>{
      const d=el("div");
      d.style.cssText="border:1px solid var(--rule2);border-radius:4px;padding:7px 9px";
      const l=el("div",null,"Draw "+r.tpl.draw+" \u00b7 "+r.task);
      l.style.cssText="font-size:11.5px;color:var(--slate);font-weight:600";
      const x=el("div",null,r.start?fmtY(r.start):"not scheduled");
      x.style.cssText="font-size:15px;font-weight:700";
      d.append(l,x); dg.appendChild(d);
    });
    dc.appendChild(dg); v.appendChild(dc);
  }
  const w=el("div","tw"); const t=el("table");
  t.innerHTML="<thead><tr><th style='width:34px'></th><th>Step</th><th>When</th>"+
    "<th class='n'>Men</th><th>What is happening</th><th></th></tr></thead>";
  const tb=el("tbody");
  let n=0;
  rows.forEach(r=>{
    const tr=el("tr");
    const isHold=r.cat==="HOLD", isDone=r.cat==="DONE";
    if(isHold) tr.className="hold";
    if(isDone) tr.className="done";
    if(r.forced) tr.style.background="var(--errbg)";
    if(next && r===next) tr.style.boxShadow="inset 3px 0 0 var(--water)";
    if(!isHold) n++;
    let when="";
    if(r.start) when = r.start===r.finish ? fmt(r.start)
      : fmt(r.start)+" \u2013 "+fmt(r.finish);
    let what;
    if(isDone) what="Done";
    else if(isHold) what=r.task==="Weather hold"
      ? "Parked for temperature. No crew, no cost."
      : "Parked, crew is on another pool.";
    else if(r.cat==="INSPECT") what="Bonding inspection. No crew, but the next step waits on it.";
    else if(r.cat==="SUB") what="Subcontractor. No Icon crew.";
    else if(r.cat==="WAIT") what=r.task==="Soak Shell"
      ? "Shell soaking, sprinklers on timer. No crew." : "Waiting on the liner. No crew.";
    else if(r.cat==="CASEY") what="Casey.";
    else what = r.forced ? "You set this date by hand." : (r.note||"Crew on site.");
    if(!isDone && r.tpl && r.tpl.inc) what += " Includes "+r.tpl.inc+".";
    if(!isDone && r.tpl && r.tpl.extra) what = "Added work. "+what;
    tr.innerHTML="<td class='n' style='color:var(--faint)'>"+(isHold?"":n)+"</td>"+
      "<td><b>"+esc(r.task)+"</b>"+(r.tpl&&r.tpl.draw?" <span class='draw'>DRAW "+r.tpl.draw+"</span>":"")+"</td>"+
      "<td>"+when+"</td>"+
      "<td class='n'>"+(r.men||"")+"</td>"+
      "<td style='color:var(--slate)'>"+esc(what)+"</td>";
    const td=el("td");
    if(App.canEdit && r.cat==="LABOR" && r.start){
      const b=el("button","btn sm","Move");
      b.onclick=()=>taskMenu(j.id,r.task); td.appendChild(b);
    }
    tr.appendChild(td);
    tb.appendChild(tr);
  });
  t.appendChild(tb); w.appendChild(t); v.appendChild(w);
  v.appendChild(el("p","note","Grey rows are finished. Amber rows are parked and use no labor. A red row is a date you set by hand. The blue edge is what the crew is on now."));
  return v;
}
async function exportCSV(){
  const head=["Pool","Type","Task","Category","Start","Finish","Men","Status","Note"];
  const lines=[head.join(",")];
  for(const r of App.sched.rows){
    lines.push([r.job,r.type,r.task,r.cat,r.start||"",r.finish||"",r.men||0,r.status,r.note||""]
      .map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(","));
  }
  try{ await App.dl.save({filename:"icon-pools-schedule.csv", data:lines.join("\n")}); }
  catch(e){ toast("Export cancelled"); }
}

      esc(info.type==="rain"?"Rain / ground":info.type==="holiday"?"Holiday":
          info.type==="reserve"?"Weather reserve":"Other")+

        recompute(); render(); toast("Day cleared. Review and approve to save."); };

    tr.appendChild(td); tb.appendChild(tr);

  t.appendChild(tb); w.appendChild(t); v.appendChild(w);

    if(ks.length){
      const p=el("p","note");
      p.textContent="Held back in the long range plan: "+ks.map(k=>{
        const dd=sd(k+"-01"); return MON[dd.getMonth()]+" "+est[k]+" days";}).join(", ")+
        ". These come from the last three winters and are not a forecast.";
      v.appendChild(p);
    }
    if(manual.length){
      const w=el("div","tw"); const t=el("table");
      t.innerHTML="<thead><tr><th>Date</th><th>Day</th><th>Note</th><th></th></tr></thead>";
      const tb=el("tbody");

        tr.innerHTML="<td>"+fmtY(d)+"</td><td>"+dow(d)+"</td><td style='color:var(--slate)'>"+esc(info.note||"")+"</td>";
        const td=el("td");
        if(App.canEdit){ const b=el("button","btn sm","Warm enough after all");

          td.appendChild(b); }
        tr.appendChild(td); tb.appendChild(tr);
      });
      t.appendChild(tb); w.appendChild(t); v.appendChild(w);

      v.appendChild(el("p","note","No cold days marked by hand. When a pour day turns out too cold, pick \u201cToo cold to pour\u201d above and only the concrete work moves."));
    }
  }
  if(!entries.length) v.appendChild(el("p","note","No blocked days ahead. Weekends are already excluded."));
  return v;
}

  v.appendChild(c2);

    ["No fixed limit on pools open","Pools are laid out in the order customers were promised, each as close to its promise date as eight men allow. The guard is idle time: the board will not open a pool it would have to walk away from for weeks mid-build. Set that limit under Rules."],
    ["Parking a pool is normal","A vinyl pool started in December builds through lights and then holds until April for the bottom and liner. Holds appear as their own lines and use no labor. That is the winter strategy working, not a failure."],
    ["Waiting is not labor","Liner lead time runs alongside deck and equipment pad work. Gunite soak runs seven calendar days including the weekend. Gunite shoot and plaster are subcontracted and take calendar time but none of your men."],
    ["What it will not guess","Rework, unforeseen site conditions, other trades on site, material delays, Leawood permitting. Block the days you lose under Lost days, or pin a task so it cannot start before a date. The scheduler will not invent a delay it cannot know about."]

      p.days+" workable days from "+(p.from||"?"), p.due||"-",
      p.over==null?"-":(p.overFlag+(p.wx?" (after "+p.wx+" days parked for liner/plaster season, which is weather and not a delay)":"")),
      m.reason||(j.holdUntil?"held until "+j.holdUntil:"")].join(" | "));
  });
  L.push("Contract terms: completion is <n> WORKABLE days after excavation. Weekends and holidays are not workable days. "+
    "Force majeure (weather, ground water, soil, obstacles, permits) extends completion by 5 calendar days per delay day "+
    "for the first 6 delay days, then 3 per day. A positive 'days over' means the pool misses the CONTRACT date, which is rare and serious. "+
    "Separately, 'customer hears' is the plain reading of the day count, and a pool can be legally fine while badly overrunning what the customer expects.");
  const holds=App.sched.rows.filter(r=>r.cat==="HOLD");

function findJob(name){
  const n=String(name||"").toLowerCase().trim();
  return App.staged.jobs.find(j=>j.name.toLowerCase()===n)
      || App.staged.jobs.find(j=>j.name.toLowerCase().indexOf(n)===0)
      || App.staged.jobs.find(j=>j.name.toLowerCase().includes(n));
}
function findTask(job,name){
  const n=String(name||"").toLowerCase().trim();
  const list=taskList(job).map(t=>t.t);
  return list.find(t=>t.toLowerCase()===n) || list.find(t=>t.toLowerCase().includes(n)) || null;
}
/* Changes are PROPOSED during a turn, previewed, and applied only on approval. */
let PENDING=[];
function propose(desc,run){ PENDING.push({desc,run}); return {proposed:true, willDo:desc}; }
function sj(staged,id){ return staged.jobs.find(x=>x.id===id); }
function curDur(j,task){ const t=taskList(j).find(x=>x.t===task); return t?t.d:null; }
function fmtDays(d){ return d===0.5?"half a day":d===1?"1 day":(Math.round(d*100)/100)+" days"; }

const ASSIST_TOOLS=()=>([
  {name:"get_pool_schedule", description:"Every step for one pool with dates, men and status. Use it to find exact step names before proposing a change.",
   inputSchema:{type:"object",properties:{pool:{type:"string"}},required:["pool"]},
   execute:({pool})=>{
     const j=findJob(pool); if(!j) return {error:"No pool called "+pool};
     return App.sched.rows.filter(r=>r.jobId===j.id).map(r=>({
       step:r.task, start:r.start, finish:r.finish, men:r.men, days:r.dur, status:r.status}));
   }},
  {name:"get_day", description:"Who is working on a date (YYYY-MM-DD).",
   inputSchema:{type:"object",properties:{date:{type:"string"}},required:["date"]},
   execute:({date})=>{
     const L=dayLoad(App.sched.rows,date);
     return {date, crew:crewOn(date), blocked:App._blocked[date]||null, menCommitted:L.total,
       pools:Object.keys(L.byJob).map(id=>({pool:(jobById(id)||{}).name,
         men:L.byJob[id].men, steps:[...new Set(L.byJob[id].tasks)]}))};
   }},
  {name:"get_todo", description:"Trigger to-do items with due dates.",
   inputSchema:{type:"object",properties:{}},
   execute:()=>triggerItems().slice(0,40).map(x=>({due:x.due, action:x.trig.action,
     pool:x.pool, step:x.step, who:x.trig.who, done:x.done}))},

  {name:"add_time_to_step", description:"Add time to an existing step on one pool, for rework or slow progress. Example: tile had to be redone, add a day to Set Tile.",
   inputSchema:{type:"object",properties:{pool:{type:"string"},step:{type:"string"},
     add_days:{type:"number",description:"0.5 for half a day"}},required:["pool","step","add_days"]},
   execute:({pool,step,add_days})=>{
     const j=findJob(pool); if(!j) return {error:"No pool called "+pool};
     const t=findTask(j,step); if(!t) return {error:"No step like "+step+" on "+j.name};
     const was=curDur(j,t), now=Math.round((was+(+add_days))*100)/100;
     const id=j.id;
     return propose(j.name+": "+t+" goes from "+fmtDays(was)+" to "+fmtDays(now),
       st=>{ const q=sj(st,id); q.overrides=q.overrides||{}; q.overrides[t]=now; });
   }},
  {name:"add_extra_work", description:"Add a new chunk of work to one pool, placed right after an existing step. Example: add a half day for 4 guys at Brown for plumbing.",
   inputSchema:{type:"object",properties:{pool:{type:"string"},label:{type:"string",description:"short name, e.g. Extra plumbing"},
     after_step:{type:"string"},days:{type:"number"},men:{type:"number"}},
     required:["pool","label","after_step","days","men"]},
   execute:({pool,label,after_step,days,men})=>{
     const j=findJob(pool); if(!j) return {error:"No pool called "+pool};

     const id=j.id, xid="x"+Date.now().toString(36)+Math.floor(Math.random()*999);
     return propose(j.name+": add "+label+", "+fmtDays(+days)+" with "+men+" men, right after "+t,
       st=>{ const q=sj(st,id); q.extras=q.extras||[];
         q.extras.push({id:xid,label:label,d:+days,m:+men,after:t}); });
   }},
  {name:"set_step_length", description:"Set a step to an exact length on one pool.",
   inputSchema:{type:"object",properties:{pool:{type:"string"},step:{type:"string"},days:{type:"number"}},
     required:["pool","step","days"]},
   execute:({pool,step,days})=>{
     const j=findJob(pool); if(!j) return {error:"No pool called "+pool};
     const t=findTask(j,step); if(!t) return {error:"No step like "+step};
     const id=j.id;
     return propose(j.name+": "+t+" set to "+fmtDays(+days),
       st=>{ const q=sj(st,id); q.overrides=q.overrides||{}; q.overrides[t]=+days; });
   }},
  {name:"move_step_to_date", description:"Put a step on an exact date, even if it overloads the crew. Works for crew steps, inspections, subs, Layout and Casey steps. Replaces any not-before date on that step.",
   inputSchema:{type:"object",properties:{pool:{type:"string"},step:{type:"string"},date:{type:"string"}},
     required:["pool","step","date"]},
   execute:({pool,step,date})=>{
     const j=findJob(pool); if(!j) return {error:"No pool called "+pool};

     return propose(j.name+": "+t+" moved to "+fmt(date),
       st=>{ const q=sj(st,id); q.force=q.force||{}; q.force[t]=date; if(q.pins) delete q.pins[t]; clearLaterDates(q,t,date);
             if(t==="Excavation" && q.holdUntil && diffD(date,q.holdUntil)<0) delete q.holdUntil; });
   }},
  {name:"hold_step_until", description:"Stop a step starting before a date.",

     return propose(j.name+": "+t+" will not start before "+fmt(date),

   }},
  {name:"mark_step_done", description:"Record that one step is already finished even though steps before it are not, for example benches formed before the inspection. For steps finished in order, use mark_complete_through instead.",
   inputSchema:{type:"object",properties:{pool:{type:"string"},step:{type:"string"}},required:["pool","step"]},

   }},
  {name:"mark_complete_through", description:"Record that a pool is finished through a step, meaning that step and every step before it are done.",

  {name:"block_day", description:"Mark a day lost for rain, a holiday or other.",

  {name:"set_crew_for_day", description:"Fewer men on a day, for PTO or sickness.",

  {name:"set_rule", description:"Change a scheduling rule: crew, stallLimit (days a pool may sit idle mid-build before its start is held back), heavyMen, coldFactor, linerLead, rainSpring, rainOther, rainImpact, splitSpan, reserveFrom.",
   inputSchema:{type:"object",properties:{name:{type:"string"},value:{type:"number"}},required:["name","value"]},
   execute:({name,value})=>{
     const ok=["crew","stallLimit","heavyMen","warmDec","warmJan","warmFeb","warmMar","linerLead","linerDays","digDays","backfillDays","collarDays","bottomExtra","caseyOnCall","guniteLead","oneDig","onePlaster","caseyLayout","caseyLiner","rainSpring","rainOther",
               "rainImpact","splitSpan","reserveFrom"];
     if(ok.indexOf(name)<0) return {error:"Not a rule I can change. Options: "+ok.join(", ")};
     return propose("Rule "+name+" set to "+value,
       st=>{ st.cfg=st.cfg||{}; st.cfg[name]=+value; });
   }}
]);

function previewOps(ops){
  const before=currentMap(), finB={};
  App.staged.jobs.forEach(j=>finB[j.id]=(j._meta||{}).plannedFinish);
  const snap=clone(App.staged);
  try{ ops.forEach(o=>o.run(App.staged)); recompute(); }catch(e){}
  const after=currentMap(), finA={};
  App.staged.jobs.forEach(j=>finA[j.id]=(j._meta||{}).plannedFinish);
  App.staged=snap; recompute();
  let moved=0; Object.keys(after).forEach(k=>{ if(before[k] && before[k]!==after[k]) moved++; });
  const pools=[];
  Object.keys(finA).forEach(id=>{ if(finB[id]!==finA[id]){
    const j=jobById(id); pools.push({name:j?j.name:id, was:finB[id], now:finA[id]}); }});
  return {moved, pools};
}

"Kansas City run by Kelly Wilson. Be brief and practical, like a good project manager. Plain sentences.\n\n"+
"WHEN KELLY ASKS FOR A CHANGE: call the change tools to PROPOSE it. Nothing changes until she approves "+
"the card that appears under your reply. In your reply say exactly what will change in a sentence or two, "+

"question instead of guessing. Look up exact step names with get_pool_schedule first.\n\n"+

"DATES: work out every relative day from the TODAY line before you call a tool. Which tool for which wording: "+

"'X can't start before a day' is hold_step_until. 'Nothing on this pool before a day' is hold_pool_until. "+

  v.appendChild(el("p","sub","Ask about the schedule or tell it what changed on site. It tells you exactly what it will change, and nothing moves until you approve."));
  if(!App.sample){

  }
  const wrap=el("div","chat");
  const msgs=el("div","msgs"); wrap.appendChild(msgs);
  const draw=()=>{
    msgs.innerHTML="";
    if(!App.chat.length){
      const w=el("div","msg a");
      w.textContent="Tell me what changed on site, like \u201ctile had to be redone at Brown, add a day to Set Tile,\u201d or ask why a pool is late.";
      msgs.appendChild(w);
    }
    App.chat.forEach(m=>{
      const d=el("div","msg "+(m.role==="user"?"u":"a"));
      d.textContent=m.content;
      if(m.proposal){
        const P=m.proposal;
        const card=el("div");

          "padding:9px 11px;background:var(--sunk);white-space:normal";

        h.style.cssText="font-weight:700;font-size:12.5px;margin-bottom:5px;color:"+

        card.appendChild(h);
        P.ops.forEach(o=>{ const li=el("div",null,"\u2022 "+o.desc);
          li.style.cssText="font-size:13.5px;margin:2px 0"; card.appendChild(li); });
        const pv=el("div");
        pv.style.cssText="font-size:12.5px;color:var(--slate);margin-top:6px";
        pv.textContent = P.preview.pools.length
          ? "Finish dates that move: "+P.preview.pools.map(x=>x.name+" "+fmt(x.was)+" \u2192 "+fmt(x.now)).join(", ")+
            ". "+P.preview.moved+" step"+(P.preview.moved===1?"":"s")+" shift in total."
          : (P.preview.moved? P.preview.moved+" steps shift, but no pool's finish date changes."
             : "No dates move.");
        card.appendChild(pv);
        if(P.state==="pending" && App.canEdit){
          const row=el("div","row"); row.style.marginTop="8px";
          const ok=el("button","btn sm primary","Approve");
          const no=el("button","btn sm","Cancel");
          ok.onclick=async()=>{
            ok.disabled=no.disabled=true;
            P.ops.forEach(o=>o.run(App.staged)); recompute();
            const saved=await saveAll();
            P.state=saved?"applied":"pending";
            if(saved) toast("Saved");
            draw(); renderPending();
          };
          no.onclick=()=>{ P.state="cancelled"; draw(); };
          row.append(ok,no); card.appendChild(row);
        } else if(P.state==="pending"){
          card.appendChild(el("div","note","View only. Ask someone with edit access to approve."));
        }
        d.appendChild(card);
      }
      msgs.appendChild(d);
    });
    msgs.scrollTop=msgs.scrollHeight;
  };
  draw();
  const chips=el("div","chips");
  ["What is on my to-do list this week?","Why is Criner late?",
   "Tile had to be redone at Brown, add a day to Set Tile",
   "Where am I short on crew next week?"].forEach(q=>{
    const c=el("button","chip",q); c.onclick=()=>{ta.value=q; send();}; chips.appendChild(c);
  });
  wrap.appendChild(chips);
  const row=el("div","askrow");
  const ta=el("textarea"); ta.placeholder="Tell me what changed, or ask a question";
  const go=el("button","btn primary","Send");
  row.append(ta,go); wrap.appendChild(row);
  v.appendChild(wrap);

  async function send(){
    const q=ta.value.trim(); if(!q||App.chatBusy) return;
    ta.value=""; App.chatBusy=true; go.disabled=true; go.textContent="Thinking";
    App.chat.push({role:"user",content:q});
    const slot={role:"assistant",content:"Thinking..."};
    App.chat.push(slot); draw();
    const hist=App.chat.slice(0,-2).slice(-6).map(m=>({role:m.role,content:m.content}));
    const input=[{role:"user",content:ASSIST_BRIEF()},
                 {role:"assistant",content:"Understood. What do you need?"}]
                .concat(hist).concat([{role:"user",content:q}]);
    PENDING=[];
    try{
      const res=await App.sample(input,{tools:ASSIST_TOOLS(), modelTier:"default", cache:false,
        onText:({text})=>{ slot.content=text; draw(); }});
      slot.content=(res&&res.text)||slot.content;
    }catch(e){
      slot.content = e&&e.code==="not_granted" ? "I need permission to run. Reload and allow it when asked."
        : e&&e.code==="rate_limited" ? "Too many requests just now. Give it a minute."
        : (e&&e.text) || "Something went wrong. Try again.";
    }
    if(PENDING.length){
      const ops=PENDING.slice(); PENDING=[];
      slot.proposal={ops, preview:previewOps(ops), state:"pending"};
    }
    App.chatBusy=false; go.disabled=false; go.textContent="Send";
    draw();
  }
  go.onclick=send;
  ta.onkeydown=e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); send(); } };
  return v;
}

async function printSheets(from){
  const html=crewSheetHTML(from);
  let w=null;
  try{ w=window.open("","_blank","width=1100,height=800"); }catch(e){ w=null; }
  if(w && w.document){
    w.document.open(); w.document.write(html); w.document.close();
    const go=()=>{ try{ w.focus(); w.print(); }catch(e){} };
    if(w.document.readyState==="complete") setTimeout(go,120);
    else w.onload=()=>setTimeout(go,120);
    toast("Crew sheet opened in a new tab");
    return;
  }
  if(App.dl){
    try{
      await App.dl.save({filename:"icon-pools-crew-sheet.html", data:html});
      toast("Saved. Open the file and print it on Tabloid (11 x 17), landscape.");
      return;
    }catch(e){}
  }
  showSheetInline(html);
}

    else{
      const pools={};
      m.caused.forEach(c=>(pools[c.job]=pools[c.job]||[]).push(c));
      const names=Object.keys(pools);

        (names.length>1?" in "+names.length+" pools":""));
      const ul=el("ul","shiftlist"); ul.hidden=true;
      // one line per pool: how many of its steps moved, and its first one
      names.forEach(p=>{
        const cs=pools[p].sort((a,b)=>String(a.was).localeCompare(String(b.was))), c=cs[0];
        ul.appendChild(el("li",null,p+": "+(cs.length>1?cs.length+" steps, starting with ":"")+
          c.task+" "+fmt(c.was)+" → "+fmt(c.now)));

      td.append(btn,ul);
    }
    tr.appendChild(td); tb.appendChild(tr);

  return v;
}

/* ---------- MAIN RENDER ---------- */
function render(){
  renderTabs(); renderPending();
  const host=document.getElementById("view"); host.innerHTML="";
  let v;
  try{
    v = App.tab==="board"?viewBoard():App.tab==="pipeline"?viewPipeline():
        App.tab==="schedule"?viewSchedule():App.tab==="calendar"?viewCalendar():
        App.tab==="outlook"?viewOutlook():App.tab==="assist"?viewAssist():
        App.tab==="moves"?viewMoves():
        App.tab==="settings"?viewSettings():viewHelp();
  }catch(e){
    console.error(e);
    v=el("div","banner","Something went wrong drawing this view. Switch tabs and back, or reload.");
  }
  host.appendChild(v);
}

/* ---------- BOOT ---------- */
document.getElementById("themeBtn").onclick=function(){
  const cur=document.documentElement.getAttribute("data-theme");
  const next = cur==="dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme",next);
  this.textContent = next==="dark" ? "Light" : "Dark";
};
recompute();
render();

/* ---------- CONNECTION to the team app's Supabase database ----------
   Speaks the same doc()/collection() language the board was written for, so
   nothing above had to change. Sign-in comes from the team app on this device;
   the database decides who may save (Owners and Administrators). */
// Inside the team app's Construction tab, the team app shows the brand and the
// way back, and a lapsed sign-in sends the whole app to its sign-in screen.
const EMBEDDED = window.self!==window.top;
if(EMBEDDED) document.documentElement.classList.add("embedded");
const goSignIn=()=>{ (EMBEDDED?window.top:window).location.replace("./"); };
let BoardDB_checkNow=()=>{};   // set once live updates start; asks the server right away
const BoardDB=(function(){
  const CFG=window.APP_CONFIG||{};
  let token=null; try{ token=JSON.parse(localStorage.getItem("ipt.token")); }catch(e){}
  async function rpc(fn,args){
    const h={"Content-Type":"application/json","apikey":CFG.supabaseKey};
    if(/^eyJ/.test(CFG.supabaseKey||"")) h.Authorization="Bearer "+CFG.supabaseKey;
    const res=await fetch(String(CFG.supabaseUrl).replace(/\/+$/,"")+"/rest/v1/rpc/"+fn,
      {method:"POST", headers:h, body:JSON.stringify(Object.assign({p_token:token},args||{}))});
    const text=await res.text(); let data=null; try{ data=text?JSON.parse(text):null; }catch(e){}
    if(!res.ok){
      const msg=(data&&data.message)||("Server error ("+res.status+")");
      if(msg==="SESSION_EXPIRED") goSignIn();
      const err=new Error(msg); err.code = msg==="VIEW_ONLY" ? "invalid_argument" : "server";
      throw err;
    }
    return data;
  }
  let version=null;
  const snap=data=>({exists:data!=null, data:()=>data, metadata:{hasPendingWrites:false}});
  const write=async(op,path,data)=>{
    // The version isn't advanced here: someone else may have saved just before this
    // write, and taking the new number would mark their change as already seen.
    await rpc("board_write",{p_op:op, p_path:path, p_data:data==null?null:data});
  };
  const db={
    doc(path){ return {
      get: async()=>snap(await rpc("board_get",{p_path:path})),
      set: data=>write("set",path,data),
      update: data=>write("update",path,data),
      delete: ()=>write("delete",path),
      // checks every 10 seconds (and when the screen comes back) whether anyone saved.
      // If the screen can't take the update yet (cb returns false), the version is
      // left alone so the update is retried on the next check instead of lost.
      onSnapshot(cb){
        let busy=false;
        const tick=async()=>{
          if(document.hidden || busy) return;
          busy=true;
          try{
            const r=await rpc("board_version");
            if(version===null) version=r.version;
            else if(r.version!==version){
              const seen=r.version;
              if((await cb(snap({})))!==false) version=seen;
            }
          }catch(e){}
          busy=false;
        };
        const h=setInterval(tick,10000);
        const wake=()=>{ if(!document.hidden) tick(); };
        document.addEventListener("visibilitychange",wake);
        window.addEventListener("focus",wake);
        window.addEventListener("pageshow",wake);
        BoardDB_checkNow=tick;
        return ()=>clearInterval(h);
      }
    }; },
    collection(name){ return {
      get: async()=>{
        const list=await rpc("board_list",{p_folder:name})||[];
        return {docs:list.map(x=>({id:x.id, data:()=>x.data}))};
      }
    }; }
  };
  return {token, rpc, db, setVersion:v=>{ version=v; }};
})();
// CSV export and crew sheets download straight to the device
const Downloads={
  async save({filename,data}){
    const type=/\.csv$/i.test(filename)?"text/csv":/\.html?$/i.test(filename)?"text/html":"application/octet-stream";
    const url=URL.createObjectURL(new Blob([data],{type}));
    const a=document.createElement("a"); a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000);
  }
};

(async function(){
  if(!BoardDB.token){ goSignIn(); return; }
  let me;
  try{ me=await BoardDB.rpc("me"); }
  catch(e){
    document.getElementById("view").prepend(Object.assign(document.createElement("div"),
      {className:"banner",textContent:"Can't reach the server. Check your connection and reload."}));
    return;
  }
  if(!me || !me.ok){ goSignIn(); return; }
  const roles=me.employee.roles||[];
  App.canEdit = roles.indexOf("Owner")>=0 || roles.indexOf("Administrator")>=0;
  App.db=BoardDB.db; App.dl=Downloads; App.sample=null; App.user=null;
  document.getElementById("whoami").textContent = me.employee.name + (App.canEdit?"":" · View only");
  App.meName = me.employee.name;   // recorded on each hand move
  try{ const v=await BoardDB.rpc("board_version"); BoardDB.setVersion(v.version); }catch(e){}
  await loadAll();
  render();
  App.db.doc("config/baseline").onSnapshot(async snap=>{
    if(!snap.exists) return;
    if(snap.metadata && snap.metadata.hasPendingWrites) return;
    // never clobber unreviewed local edits; returning false retries once they're approved or discarded
    if(App.canEdit && isDirty()){ App.remoteWaiting=true; renderPending(); return false; }
    App.remoteWaiting=false;
    await loadAll(); render(); toast("Board updated");
  },()=>{});
})();
if("serviceWorker" in navigator && location.protocol==="https:"){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>

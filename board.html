<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Icon Pools Production Board</title>
<meta name="theme-color" content="#15637E">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EFF2F4; --surface:#FFFFFF; --sunk:#F7F9FA;
  --ink:#141C22; --slate:#57666F; --faint:#8C9AA3;
  --rule:#D4DCE1; --rule2:#E6ECEF;
  --water:#15637E; --dig:#8A6432; --oxide:#993030; --moss:#2C6B4C;
  --warnbg:#FBF0DC; --errbg:#FAE3E3; --okbg:#DFF0E6;
  --radius:4px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0D1319; --surface:#161F27; --sunk:#111922;
    --ink:#E4EBF0; --slate:#9AAAB4; --faint:#6C7C87;
    --rule:#28343E; --rule2:#1E2831;
    --water:#4FA8C7; --dig:#C89B5C; --oxide:#D9756F; --moss:#6BB68F;
    --warnbg:#2E2617; --errbg:#331C1C; --okbg:#16291F;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1319; --surface:#161F27; --sunk:#111922;
  --ink:#E4EBF0; --slate:#9AAAB4; --faint:#6C7C87;
  --rule:#28343E; --rule2:#1E2831;
  --water:#4FA8C7; --dig:#C89B5C; --oxide:#D9756F; --moss:#6BB68F;
  --warnbg:#2E2617; --errbg:#331C1C; --okbg:#16291F;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; height:100%; background:var(--paper); color:var(--ink);
  font-family:"Barlow",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.cond{font-family:"Barlow Condensed","Barlow",sans-serif}
.num{font-variant-numeric:tabular-nums}

/* inside the team app's Construction tab, the team app's own bar does this job */
.embedded header.bar{display:none}
.embedded nav.tabs{top:0}

/* ---------- chrome ---------- */
header.bar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:40;
  background:var(--surface); border-bottom:1px solid var(--rule);
  display:flex; align-items:center; gap:14px; padding:9px 16px; flex-wrap:wrap;
}
.brand{font-weight:700; letter-spacing:-.01em; font-size:16px; white-space:nowrap}
.brand span{color:var(--slate); font-weight:500}
.grow{flex:1 1 auto}
nav.tabs{display:flex; gap:2px; padding:0 10px; background:var(--surface);
  border-bottom:1px solid var(--rule); overflow-x:auto; position:sticky;
  top:calc(env(safe-area-inset-top,0px) + 47px); z-index:38}
nav.tabs button{
  border:0; background:none; padding:9px 13px; font-weight:600; font-size:14px;
  color:var(--slate); border-bottom:2px solid transparent; white-space:nowrap;
}
nav.tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--water)}
nav.tabs button:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{
  outline:2px solid var(--water); outline-offset:1px}
main{padding:16px; max-width:1500px; margin:0 auto}
h2{font-size:18px; margin:0 0 3px; letter-spacing:-.01em}
.sub{color:var(--slate); font-size:13.5px; margin:0 0 16px; max-width:72ch}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--rule); background:var(--surface); color:var(--ink);
  padding:6px 12px; border-radius:var(--radius); font-weight:600; font-size:14px}
.btn:hover{border-color:var(--slate)}
.btn.primary{background:var(--water); border-color:var(--water); color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent; color:var(--slate)}
.btn.sm{padding:3px 9px; font-size:13px}
.btn:disabled{opacity:.45; cursor:default}

/* ---------- pending bar ---------- */
.pending{display:flex; align-items:center; gap:10px; background:var(--warnbg);
  border:1px solid var(--dig); border-radius:var(--radius); padding:8px 12px;
  margin:0 0 16px; flex-wrap:wrap}
.pending strong{font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dig);flex:none}

/* ---------- board controls ---------- */
.boardctl{display:flex; align-items:center; gap:8px; margin-bottom:12px; flex-wrap:wrap}

/* ---------- tables ---------- */
.tw{overflow-x:auto; background:var(--surface); border:1px solid var(--rule);
  border-radius:var(--radius)}
table{border-collapse:collapse; width:100%; font-size:13.5px}
th{font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:14px;
  text-align:left; padding:7px 10px; border-bottom:1px solid var(--rule);
  color:var(--slate); white-space:nowrap; background:var(--sunk); position:sticky; top:0}
td{padding:6px 10px; border-bottom:1px solid var(--rule2); vertical-align:top}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
.swatch{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;
  vertical-align:baseline}
.pill{display:inline-block; padding:1px 7px; border-radius:9px; font-size:12px;
  font-weight:600; white-space:nowrap}
.pill.ok{background:var(--okbg); color:var(--moss)}
.pill.warn{background:var(--warnbg); color:var(--dig)}
.pill.bad{background:var(--errbg); color:var(--oxide)}
.pill.mut{background:var(--rule2); color:var(--slate)}
tr.hold td{background:var(--warnbg)}
tr.done td{color:var(--faint)}

/* ---------- forms ---------- */
.card{background:var(--surface); border:1px solid var(--rule); border-radius:var(--radius);
  padding:14px 16px; margin-bottom:14px}
.card h3{margin:0 0 10px; font-size:15px}
.fgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:11px}
label.f{display:flex; flex-direction:column; gap:3px; font-size:12.5px; color:var(--slate);
  font-weight:600}
label.f input,label.f select{padding:6px 8px; border:1px solid var(--rule);
  border-radius:var(--radius); background:var(--sunk); color:var(--ink); font-weight:500;
  font-size:14px; width:100%}
label.cb{display:flex; align-items:center; gap:7px; font-size:14px; font-weight:600;
  color:var(--ink); align-self:end; padding-bottom:6px}
.row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.mt{margin-top:12px}

/* ---------- modal ---------- */
.scrim{position:fixed; inset:0; background:rgba(8,14,19,.55); z-index:60; display:flex;
  align-items:flex-start; justify-content:center; padding:24px 14px; overflow-y:auto}
.modal{background:var(--surface); border-radius:6px; max-width:860px; width:100%;
  border:1px solid var(--rule)}
.mhead{padding:14px 18px; border-bottom:1px solid var(--rule); display:flex;
  align-items:center; gap:10px}
.mhead h3{margin:0; font-size:17px}
.mbody{padding:16px 18px; max-height:64vh; overflow-y:auto}
.mfoot{padding:12px 18px; border-top:1px solid var(--rule); display:flex; gap:8px;
  justify-content:flex-end; flex-wrap:wrap}
.delta{font-variant-numeric:tabular-nums; font-weight:700}
.delta.late{color:var(--oxide)} .delta.early{color:var(--moss)}

.legend{display:flex; gap:12px; flex-wrap:wrap; font-size:12.5px; color:var(--slate);
  margin-top:10px}
.legend span{display:flex; align-items:center; gap:5px}
.note{font-size:12.5px; color:var(--faint); margin-top:8px}
.banner{background:var(--sunk); border:1px solid var(--rule); border-left:3px solid var(--water);
  padding:9px 12px; border-radius:var(--radius); font-size:13.5px; margin-bottom:14px}
#toast{position:fixed; left:50%; transform:translateX(-50%); bottom:24px; z-index:80;
  background:var(--ink); color:var(--paper); padding:9px 16px; border-radius:20px;
  font-weight:600; font-size:14px; opacity:0; pointer-events:none; transition:opacity .18s}
#toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important; animation:none!important}}



/* ---------- status strip ---------- */
.strip{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px}
.stat{background:var(--surface); border:1px solid var(--rule); border-radius:5px;
  padding:7px 12px; min-width:104px}
.stat .k{font-size:11px; font-weight:600; color:var(--slate); letter-spacing:.02em}
.stat .val{font-family:"Barlow Condensed",sans-serif; font-size:23px; font-weight:700;
  line-height:1.05; font-variant-numeric:tabular-nums}
.stat.alert{border-color:var(--oxide); background:var(--errbg)}
.stat.alert .val,.stat.alert .k{color:var(--oxide)}
.stat.warn{border-color:var(--dig); background:var(--warnbg)}
.stat.warn .val,.stat.warn .k{color:var(--dig)}
.stat.act{cursor:pointer}
.stat.act:hover{border-color:var(--water)}
.sechead{display:flex; align-items:baseline; gap:8px; margin:20px 0 8px}
.sechead h3{margin:0; font-size:15px}
.sechead span{font-size:13px; color:var(--slate)}

/* ---------- two-week calendar ---------- */
.calwrap{background:var(--surface); border:1px solid var(--rule); border-radius:6px; padding:10px}
.dowrow{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:6px}
.dowrow div{font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:13px;
  color:var(--slate); text-align:center}
.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
.cell2{border:1px solid var(--rule2); border-radius:5px; min-height:128px; padding:5px 6px;
  display:flex; flex-direction:column; gap:4px; background:var(--surface)}
.cell2.off{background:var(--sunk); border-style:dashed}
.cell2.today{border-color:var(--water); border-width:2px; padding:4px 5px}
.cell2.over{border-color:var(--oxide); border-width:2px; padding:4px 5px}
.cell2.drop{outline:2px dashed var(--water); outline-offset:1px; background:var(--sunk)}
.c2h{display:flex; align-items:baseline; gap:5px}
.c2h .d{font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:16px}
.c2h .t{margin-left:auto; font-size:10.5px; font-weight:600; color:var(--dig)}
.chip2{border-left:4px solid var(--jc,var(--water)); background:var(--sunk); border-radius:3px;
  padding:3px 6px; font-size:12px; line-height:1.25; cursor:grab; user-select:none}
.chip2:active{cursor:grabbing}
.chip2 b{display:block; font-weight:700; font-size:12.5px}
.chip2 i{font-style:normal; color:var(--slate)}
.chip2.forced{box-shadow:inset 0 0 0 1px var(--oxide)}
.chip2.dragging{opacity:.35}
.chip2.casey{border-left-color:var(--moss)}
.chip2.insp{border-left-color:var(--slate); background:transparent; border-left-style:dashed}
.draw{display:inline-block; background:var(--moss); color:#fff; border-radius:3px;
  font-size:9.5px; font-weight:700; padding:0 4px; margin-left:4px; vertical-align:1px}
.bar{display:flex; gap:1px; margin-top:auto; padding-top:4px}
.bar i{flex:1; height:7px; border-radius:1px; background:var(--rule2)}
.bar i.on{background:var(--jc,var(--water))}
.c2f{font-size:10.5px; color:var(--faint); font-variant-numeric:tabular-nums}
.c2f.over{color:var(--oxide); font-weight:700}
.overflag{color:var(--oxide); font-weight:700}
tr.nextslot td{background:var(--paper2, rgba(127,127,127,.07)); border-top:1px dashed var(--rule2, #bbb)}
.overbox{border:2px solid var(--oxide); border-radius:4px; padding:8px 11px; margin-bottom:12px; font-size:13.5px}
.overbox ul{margin:5px 0 5px 18px; padding:0}
/* move reasons */
.mvnote{display:block; font-size:11px; line-height:1.3; color:var(--dig); font-weight:600; margin:1px 0 2px}
p.mvnote{font-size:13px; margin:-6px 0 12px}
.reasons{display:flex; flex-direction:column; gap:2px}
.reasons label.cb{padding:8px 0; align-self:stretch}
.reasons input{width:18px; height:18px; accent-color:var(--water)}
.shiftlist{margin:6px 0 0 16px; padding:0; font-size:12.5px}
.shiftlist[hidden]{display:none}
.chip2 i.step{display:block; cursor:pointer; text-decoration:underline dotted; text-underline-offset:2px}
.reasons .btn{margin-bottom:6px}
@media (max-width:820px){
  .dowrow{display:none}
  .cal{grid-template-columns:repeat(2,1fr)}
  .cell2{min-height:112px}
}
/* ---------- long range ---------- */
.lr td.m{padding:0; height:26px}
.lr .blk{height:15px; border-radius:2px; background:var(--jc); margin:0 1px}
.lr .hld{height:15px; border-radius:2px; background:repeating-linear-gradient(45deg,
  var(--warnbg),var(--warnbg) 4px,var(--dig) 4px,var(--dig) 5px); margin:0 1px}

/* ---------- assistant ---------- */
.chat{display:flex; flex-direction:column; gap:10px}
.msgs{background:var(--surface); border:1px solid var(--rule); border-radius:var(--radius);
  padding:12px; min-height:220px; max-height:52vh; overflow-y:auto; display:flex;
  flex-direction:column; gap:12px}
.msg{max-width:88%; font-size:14.5px; line-height:1.5; white-space:pre-wrap}
.msg.u{align-self:flex-end; background:var(--water); color:#fff; padding:8px 12px;
  border-radius:12px 12px 2px 12px}
.msg.a{align-self:flex-start; color:var(--ink)}
.msg.a b{font-weight:700}
.msg .did{display:block; margin-top:7px; font-size:12.5px; color:var(--dig);
  border-left:3px solid var(--dig); padding-left:8px}
.askrow{display:flex; gap:8px; align-items:flex-end}
.askrow textarea{flex:1; padding:8px 10px; border:1px solid var(--rule); border-radius:var(--radius);
  background:var(--surface); resize:vertical; min-height:48px; font-size:14.5px}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{border:1px solid var(--rule); background:var(--surface); border-radius:14px;
  padding:4px 11px; font-size:13px; color:var(--slate)}
.chip:hover{border-color:var(--water); color:var(--ink)}

/* ---------- print ---------- */
#sheet{display:none}

@media print{
  @page{size:17in 11in; size:ledger landscape; margin:0.35in}
  header.bar,nav.tabs,main,#toast,.scrim{display:none!important}
  #sheet{display:block!important}
  body{background:#fff; color:#000; font-size:9pt; font-family:"Barlow",sans-serif}
  .ps-h{display:flex; align-items:baseline; border-bottom:2.5px solid #000;
    padding-bottom:4px; margin-bottom:7px}
  .ps-h b{font-size:17pt; letter-spacing:-.01em}
  .ps-h .r{margin-left:auto; font-size:11pt}
  .ps-g{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
  .ps-dh{font-size:8.5pt; font-weight:700; text-align:center; padding:2px 0;
    border-bottom:1px solid #000; margin-bottom:3px}
  .ps-c{border:1px solid #999; border-radius:3px; padding:4px; min-height:2.05in;
    display:flex; flex-direction:column; gap:3px; page-break-inside:avoid}
  .ps-c.off{background:#eee}
  .ps-d{font-weight:700; font-size:11pt; border-bottom:1px solid #ccc; padding-bottom:1px}
  .ps-d span{float:right; font-weight:400; font-size:8pt}
  .ps-j{border-left:3px solid #000; padding-left:4px}
  .ps-j b{font-size:9.5pt; display:block}
  .ps-j i{font-style:normal; font-size:8pt; color:#333; display:block}
  .ps-n{border-bottom:1px solid #666; height:13px; margin-top:3px}
  .ps-cap{margin-top:auto; font-size:8pt; border-top:1px solid #ccc; padding-top:2px}
  .ps-f{margin-top:7px; font-size:8.5pt; display:flex; gap:22px; border-top:1px solid #000;
    padding-top:4px}
}

  background:var(--ink); color:var(--paper); padding:9px 16px; border-radius:20px;
  font-weight:600; font-size:14px; opacity:0; pointer-events:none; transition:opacity .18s}

function buildCalendar(startStr, endStr, blocked){

function runSchedule(jobs, cfg, blocked, crewBy, coldBy){

    for(const r of rows){
      if(!r.start || (r.tpl&&r.tpl.layout) || r.cat==="DONE") continue;
      if(prev && r.cat==="LABOR" && !HARD(r.w)){
        let idle=0, c=addD(prev,1);
        while(diffD(c,r.start)<0){
          const w=sd(c).getDay();
          const workday = w!==0 && w!==6 && !blocked[c];
          const cold = r.w==="CONCRETE" && coldBy && coldBy[c];
          if(workday && !cold) idle++;
          c=addD(c,1);
        }
        if(idle>=S.stallLimit) return diffD(r.start,prev)-1;
      }
      if(r.finish && (!prev || diffD(r.finish,prev)>0)) prev=r.finish;
    }
    return 0;
  }

  const K=(id,t)=>id+"|"+t;
  let pre={};          // key -> {slots, forced, cold}
  let heavyPred={};    // key -> earliest slot its predecessors allow

  // steps that must follow the one before within a set number of days
  const TIGHT=t=> t.t==="Backfill" ? (S.backfillDays||0) : t.tight==="dig" ? (S.digDays||0)
                 : t.tight==="collar" ? (S.collarDays||0) : t.tight==="next" ? 1
                 : t.tight==="steel" ? (S.steelDays||0) : 0;
  // collar is poured the same day or the next workday after walls; the others count calendar days
  const dueOf=(t,prev)=> t.tight==="collar" ? addWork(prev,S.collarDays||1)
                        : t.tight==="next" ? addWork(prev,1) : addD(prev,TIGHT(t));
  function slotsNeeded(job,t,atIdx){
    let n=slotsFor(t.d);
    const cold=false;   // cold days are now skipped day by day instead of stretching the task
    if(job.extraDays && t.t==="Excavation") n+=Math.round(job.extraDays*2);
    return {n,cold};
  }

  /* ---- pass 1: plain greedy, to learn when each heavy pour is really ready ---- */
  reset(); heavyPred={};
  const isLinePool=j=>(j.type==="vinyl"||j.type==="gunite") && !j.hypo && !j._probe && !j.inProgress &&
    !(j.holdUntil && diffD(j.holdUntil,today)>0);
  const firstStart=rs=>{ const r=rs.find(x=>x.start && x.cat!=="DONE" && !(x.tpl&&x.tpl.layout) && x.cat!=="HOLD"); return r?r.start:null; };
  { let open=today;
    ordered.forEach(job=>{ if(isLinePool(job)) job._lineFrom=open;
      const rs=placeJob(job,true);
      if(isLinePool(job) && !job._free && !job.openEarly){ const fs=firstStart(rs||[]); if(fs && diffD(fs,open)>0) open=fs; } }); }

  /* ---- pass 2: forced dates, then heavy pours, then everything else ---- */
  reset(); pre={};
  // stage 0 - dates set by hand come first: they take their crew, dig and Casey
  // before any other pool or rule, and everything else is planned around them.
  // If hand-set steps alone go past the crew limit, the day is flagged.
  ordered.forEach(job=>{
    const f=job.force||{};
    taskList(job).forEach(t=>{
      if(!f[t.t] || t.c!=="LABOR") return;
      if(job.completedThrough && isBefore(job,t.t,job.completedThrough)) return;
      if((job.doneSteps||[]).indexOf(t.t)>=0) return;
      const i=idxOnAfter(f[t.t]);
      const {n}=slotsNeeded(job,t,i);
      const slots=[]; for(let k=0;k<n && i+k<N;k++) slots.push(i+k);
      const withCasey = t.t==="Liner Install" && S.caseyLiner;
      takeAll(slots, withCasey?Math.max(0,t.m-1):t.m, job.id);
      if(t.t==="Excavation" && S.oneDig) slots.forEach(k=>{ lock.dig[k]=1; });
      if(withCasey) slots.forEach(k=>{ casey[k]=1; });
      if(t.t==="Pool Bottom" || /plumb/i.test(t.t)) slots.forEach(k=>{ pbSlot[k]=1; });
      pre[K(job.id,t.t)]={slots,forced:true};
    });
  });
  // stage 1 - heavy pours claim capacity before light work fragments the day
  const heavies=[];
  ordered.forEach(job=>{
    if(job.hypo) return;   // pretend pools never claim crew ahead of real ones
    taskList(job).forEach(t=>{
      // steel only has to start within a week, so it does not jump the line
      if(t.c!=="LABOR" || (t.m<S.heavyMen && !(TIGHT(t)>0 && t.tight!=="steel"))) return;
      if(t.t==="Pool Bottom" && S.bottomLinerDays>0) return;
      if((job.doneSteps||[]).indexOf(t.t)>=0) return;
      const k=K(job.id,t.t);
      if(pre[k] || heavyPred[k]===undefined) return;
      heavies.push({job,t,from:heavyPred[k],key:k});
    });
  });
  heavies.sort((a,b)=>a.from-b.from);
  heavies.forEach(h=>{
    let from=h.from;
    if(HARD(h.t.w) && !winOK(h.t.w,sDate(Math.min(from,N-1)))){
      const nx=nextOpen(h.t.w,sDate(Math.min(from,N-1)));
      if(nx) from=idxOnAfter(nx);
    }
    const {n}=slotsNeeded(h.job,h.t,from);
    EXTRA = bigDay(h.t) ? (S.bottomExtra||0) : 0;
    LOCK = (h.t.t==="Excavation" && S.oneDig) ? "dig" : null; CARRY=!!h.t.carry;
    const slots=findSlots(from,n,h.t.m,h.job.id,false,h.t.w,!!h.t.am);
    EXTRA=0; LOCK=null; CARRY=false;
    if(slots){ takeAll(slots,h.t.m,h.job.id); pre[h.key]={slots,reserved:true}; }
  });
  // stage 2 - the rest, flowing around what is already claimed
  const rows=[], spans=[];
  // A pool's open stretches. Unless parkedCounts is set, a pool parked for
  // weather (waiting on the liner or plaster window) is not counted as open,
  // so a winter of parked pools never blocks a new start.
  const segsOf=rs=>{
    const real=rs.filter(r=>r.start&&r.finish&&!(r.tpl&&r.tpl.layout)&&r.cat!=="DONE");
    if(!real.length) return [];
    const out=[]; let cs=real[0].start, cf=real[0].finish;
    for(let k=1;k<real.length;k++){
      const r=real[k];
      // waiting for warm weather is not active work: a season wait (liner, plaster,
      // prep) or a concrete step held a week or more for a warm enough day
      const coldWait = r.w==="CONCRETE" && /warm enough|for temperature/.test(r.note||"");
      const parked = !S.parkedCounts && (HARD(r.w) || coldWait) && diffD(r.start,cf)>=5;
      if(parked){ out.push({s:cs,f:cf}); cs=r.start; cf=r.finish; }
      else if(diffD(r.finish,cf)>0) cf=r.finish;
    }
    out.push({s:cs,f:cf});
    return out;
  };
  const spanOf=rs=>{ const g=segsOf(rs); return g.length?g[0]:null; };
  function openConflict(sp){
    // Limit applies to opening a pool: on each day of its first open stretch,
    // count the other pools open that day. Returns the day after the earliest
    // of them closes, which is when this pool could start instead.
    if(!sp || !(S.maxOpen>0)) return null;
    let c=sp.s;
    while(diffD(c,sp.f)<=0){
      const here=spans.filter(o=>diffD(o.s,c)<=0 && diffD(o.f,c)>=0);
      if(here.length>=S.maxOpen) return addD(here.map(o=>o.f).sort()[0],1);
      c=addD(c,1);
    }
    return null;
  }
  let lineOpen=today;
  ordered.forEach(job=>{
    if(isLinePool(job)) job._lineFrom=lineOpen;
    let shift=0, res=null, why="";
    for(let tries=0;;tries++){
      LOG=[]; job._bfOver=false;
      res=placeJob(job,false,shift);
      const log=LOG; LOG=null;
      if(isManual(job) || tries>=90) break;
      // a timing rule missed: try the next workday rather than jumping a week
      if(job._bfOver){ job._bfOver=false; undo(log); shift+=(tries<60?1:5); why=why||("tight:"+(job._bfWhy||"")); continue; }
      const g=idleGap(res);
      if(g){ undo(log); shift+=g; why=why||"idle"; continue; }
      if(S.holidayBreak && job.type!=="renovation" && job.type!=="oneoff"){
        // vinyl: plumbed and backfilled before the break; gunite: the shell is shot before the break
        const ex=res.find(r=>r.task==="Excavation"&&r.finish),
              bf=res.find(r=>r.task===(job.type==="gunite"?"Shoot Gunite":"Backfill")&&r.start);
        // open at any point from the start of the break through New Year's Day
        if(ex && bf){
        const brk=y=>[y+"-"+S.holidayBreak, (y+1)+"-01-01"];
        const y0=+ex.finish.slice(0,4);
        const hit=[y0-1,y0].some(y=>{ const [bs,be]=brk(y); return diffD(ex.finish,be)<=0 && diffD(bf.start,bs)>=0; });
        if(hit){ undo(log); shift+=5; why=why||"tight:no hole is left open over the Christmas break"; continue; } }
      }
      const sp=spanOf(res), free=openConflict(sp);
      if(free){ undo(log); shift+=Math.max(1,diffD(free,sp.s)); why="open"; continue; }
      break;
    }
    delete job._bfOver; delete job._bfWhy;   // scratch flags, never saved
    if(isLinePool(job) && !job._free && !job.openEarly){ const fs=firstStart(res); if(fs && diffD(fs,lineOpen)>0) lineOpen=fs; }
    delete job._lineFrom;
    if(shift>0 && job._meta) job._meta.reason = why.indexOf("tight:")===0
      ? "Started "+shift+" days later so "+why.slice(6)
      : why==="open"
      ? "Started "+shift+" days later: "+S.maxOpen+" pools were already open"
      : "Started "+shift+" days later so the crew would not leave it sitting mid-build";
    if(job.type!=="oneoff") segsOf(res).forEach(g=>spans.push(g));
    rows.push(...res);
  });

  function isBefore(job,a,b){
    const l=taskList(job).map(x=>x.t);
    return l.indexOf(a)<=l.indexOf(b);
  }

  function placeJob(job,learn,shiftDays){
    const tasks=taskList(job), out=[];
    const pins=job.pins||{}, doneAfter=job.completedThrough||null;
    let skipping=!!doneAfter;
    // a pool may start as soon as the crew and rules allow, but never before the pool
    // ahead of it in line has opened; the promised date only sets its place in line
    const inLine = S.startEarly && (job.type==="vinyl"||job.type==="gunite") && !job.hypo && !job._probe &&
      !(job.holdUntil && diffD(job.holdUntil,today)>0);
    let earliest = inLine ? ((job._free||job.openEarly) ? today : (job._lineFrom||today)) : (job.targetStart||today);
    if(diffD(earliest,today)<0) earliest=today;
    if(job.holdUntil && diffD(job.holdUntil,earliest)>0) earliest=job.holdUntil;
    if(job.permitDays) earliest=addD(earliest,+job.permitDays);
    if(shiftDays) earliest=addD(earliest,shiftDays);
    let cur=idxOnAfter(earliest);
    let linerReady=null, firstRow=null, firstReason="", layoutRow=null, pcFin=null, fillReady=-1;

    // liner is on site linerDays calendar days after the day after the coping pour
    const linerFrom=measured=>{
      const anchor=addD(pcFin||measured,1);
      return [addD(measured,1), addD(anchor,(S.linerDays||21)-1)];
    };
    const doneSet=new Set(job.doneSteps||[]);
    const forceAll=job.force||{};
    for(let t of tasks){
      if(t.c!=="LABOR" && !t.layout && forceAll[t.t]){
        // an exact date on an inspection, sub or Casey step: start it that day
        const fi=idxOnAfter(forceAll[t.t]); if(fi>cur) cur=fi;
      }
      if(skipping){ out.push(mk(job,t,null,"DONE","Completed","",null));
        if(t.t===doneAfter) skipping=false; continue; }
      if(doneSet.has(t.t)){ out.push(mk(job,t,null,"DONE","Completed","Done ahead of order",null)); continue; }
      if(t.layout){ layoutRow=mk(job,t,null,"LABOR","Scheduled","",null); out.push(layoutRow); continue; }
      if(pins[t.t]){ const p=idxOnAfter(pins[t.t]); if(p>cur) cur=p; }

      if(t.c==="WAIT"){
        if(t.wait==="soak"){
          const a=sDate(Math.min(cur,N-1)), b=addD(a,S.soakDays-1);
          cur=idxOnAfter(addD(b,1));
          out.push(mkSpan(job,t,a,b,"WAIT","Waiting / Cure","Gunite cure, includes weekends"));
        } else if(!linerReady){
          out.push(mk(job,t,null,"DONE","Completed","Liner already ordered",null));
        } else {
          out.push(mkSpan(job,t,linerReady[0],linerReady[1],"WAIT","Waiting for Material","Liner lead time, zero labor"));
        }
        continue;
      }
      if(t.c==="CASEY"){
        const n=slotsFor(t.d); let i=cur;
        if(/^Startup/.test(t.t) && fillReady>i) i=fillReady;
        // Casey's own startup or walk-through needs him off the crew that half-day
        const caseyFree=k=>!casey[k] && men[k]<=capOn(sDate(k))+(pbSlot[k]?(S.bottomExtra||0):0);   // pbSlot marks bottom and plumbing
        while(i+n<=N && !(()=>{ for(let k=i;k<i+n;k++) if(!caseyFree(k)) return false; return true; })()) i++;
        if(i+n>N){ out.push(mk(job,t,null,"CASEY","Beyond horizon","",null)); continue; }
        for(let k=i;k<i+n;k++){ casey[k]=1; if(LOG) LOG.push(["c",k]); }
        const sl=[]; for(let k=i;k<i+n;k++) sl.push(k);
        out.push(mk(job,t,sl,"CASEY","Scheduled","",null)); cur=i+n; continue;
      }
      if(t.c==="INSPECT"){
        const n=Math.max(2,slotsFor(t.d)), sl=[];
        let i = cur>0 ? Math.min(N-1, nextDayAM(cur-1)) : 0;
        if(pins[t.t]){ const p=idxOnAfter(pins[t.t]); if(p>i) i=p; }
        for(let k=0;k<n&&i+k<N;k++) sl.push(i+k);
        out.push(mk(job,t,sl,"INSPECT","Inspection","Bonding inspection. No Icon crew.",null));
        cur=i+n; continue;
      }
      if(t.c==="SUB"){
        let i=cur;
        const subNote = t.tbd ? "Electrician. Placeholder day until the real time is set." :
                        "Subcontracted, no Icon labor";
        for(let g=0;g<400;g++){ const dt=sDate(Math.min(i,N-1));
          if(winOK(t.w,dt)) break; const nx=nextOpen(t.w,dt); if(!nx) break; i=idxOnAfter(nx); }
        const n=slotsFor(t.d), i0=i;
        const plast = t.t==="Plaster" && S.onePlaster;
        // shoot is one full day, plaster two full days in a row; a shoot waits for a warm
        // enough day; the plaster sub does one pool a day
        let subWait=false;
        for(let g=0;g<800 && i<N && !subFits(i,n,t.w,plast,!!t.am);g++){
          if(plast && lock.plaster[i]) subWait=true; i++; }
        const sl=[]; for(let k=0;k<n&&i+k<N;k++) sl.push(i+k);
        if(plast) holdLock("plaster",sl);
        if(t.t==="Plaster") fillReady=nextDayAM(sl[sl.length-1]);   // fills overnight, start up the next workday
        const waited=diffD(sDate(Math.min(i,N-1)),sDate(Math.min(i0,N-1)));
        const why = !waited ? "" : (t.t==="Plaster" ? (subWait?" | Waited "+waited+" days for the plaster sub":"")
                  : " | Waited "+waited+" days for a day warm enough to shoot");
        out.push(mk(job,t,sl,"SUB","Subcontractor",subNote+why,null));
        cur=i+n; continue;
      }

      // ---- LABOR
      if(t.t==="Liner Install" && S.caseyLiner && !t._cz){ t=Object.assign({},t,{m:Math.max(0,t.m-1), _cz:1}); }
      const needLock = (t.t==="Excavation" && S.oneDig) ? "dig" : null;
      const k=K(job.id,t.t);
      const PRI = t.m>=S.heavyMen || (TIGHT(t)>0 && t.tight!=="steel");
      if(learn && PRI) heavyPred[k]=cur;
      const claim=pre[k];
      if(!learn && claim){
        const first=claim.slots[0];
        const lastC=claim.slots[claim.slots.length-1], nxC=Math.min(N-1,((lastC>>1)+1)*2);
        const bfOut = !claim.forced && ((TIGHT(t)>0 &&
          diffD(sDate(first), dueOf(t,sDate(Math.max(0,cur-1))))>0) ||
          // walls held for this pool still need a pourable workday right after
          (t.warmNext && S.collarDays>0 && (COLD("CONCRETE",nxC) || sDate(nxC)!==addD(sDate(lastC),1))));
        if(claim.forced || (first>=cur && !bfOut)){
          const note=claim.forced?("Moved here by you"+
            (first<cur?". Earlier steps are not finished by then.":"")):"";
          // hand-set steps already hold their crew, dig and Casey from stage 0
          if(!claim.forced){ if(needLock) holdLock(needLock,claim.slots); if(t._cz) holdCasey(claim.slots); }
          const r=mk(job,t,claim.slots,"LABOR",claim.forced?"Forced":"Scheduled",note,t);
          r.forced=!!claim.forced; if(t._cz) r.casey=true; out.push(r);
          if(!firstRow) firstRow=r;
          cur=Math.max(cur,claim.slots[claim.slots.length-1]+1);
          if(t.t==="Pour Coping") pcFin=r.finish;
          if(bigDay(t)) markBig(claim.slots);
          if(t.t==="Liner Install") fillReady=Math.min(N-1,nextDayAM(claim.slots[claim.slots.length-1])+1);
          if(t.liner) linerReady=linerFrom(r.finish);
          continue;
        }
        claim.slots.forEach(i=>{ men[i]-=t.m; });   // reservation landed too early, give it back
        delete pre[k];
      }

      let from=cur, reason="";
      if(t.t==="Clean Up" && fillReady>from) from=fillReady;
      if(t.liner && S.measureLag>0){
        // measured a day or two after the coping pour; the liner clock starts then
        const lastDay=(Math.max(0,cur-1))>>1;
        from=Math.min(N-1,(lastDay+S.measureLag)*2);
      }
      if(HARD(t.w) && !winOK(t.w,sDate(Math.min(from,N-1)))){
        const nx=nextOpen(t.w,sDate(Math.min(from,N-1)));
        if(nx){ from=idxOnAfter(nx); reason="Temperature window"; }
      }
      const {n,cold}=slotsNeeded(job,t,from);
      EXTRA = bigDay(t) ? (S.bottomExtra||0) : 0;
      LOCK=needLock; NEEDCASEY=!!t._cz; CARRY=!!t.carry;
      let slots=findSlots(from,n,t.m,job.id,!!t.sp,t.w,!!t.am);
      // walls only go up when the next workday is warm enough for the collar
      const nextDayIdx=sl=>Math.min(N-1,((sl[sl.length-1]>>1)+1)*2);
      const beforeDayOff=sl=>sDate(nextDayIdx(sl))!==addD(sDate(sl[sl.length-1]),1);
      if(t.warmNext && S.collarDays>0){
        // walls only go up when the collar crew can also pour by the next workday
        const ct=tasks.find(x=>x.tight==="collar");
        const collarFits=sl=>{
          if(!ct) return true;
          const nx=nextDayIdx(sl);
          const ex=EXTRA; EXTRA=0; const lk=LOCK; LOCK=null;
          const cs=findSlots(sl[sl.length-1]+1, slotsFor(ct.d), ct.m, job.id, false, ct.w, false);
          EXTRA=ex; LOCK=lk;
          return !!cs && cs[0]<=nx+1;
        };
        for(let g=0; g<200 && slots && (COLD("CONCRETE",nextDayIdx(slots)) || beforeDayOff(slots) || !collarFits(slots)); g++)
          slots=findSlots(slots[0]+1,n,t.m,job.id,!!t.sp,t.w,!!t.am);
      }
      if(t.t==="Pool Bottom" && S.bottomLinerDays>0 && slots){
        // the bottom is only left exposed a few days: pour it when the liner can follow
        const lt=tasks.find(x=>x.t==="Liner Install");
        if(lt){ const czL=!!S.caseyLiner, mL=czL?Math.max(0,lt.m-1):lt.m;
          for(let g=0; g<150 && slots; g++){
            const end=slots[slots.length-1];
            const ex=EXTRA; EXTRA=0; NEEDCASEY=czL;
            const lin=findSlots(end+1,slotsFor(lt.d),mL,job.id,false,lt.w,true);
            NEEDCASEY=false; EXTRA=ex;
            if(lin && diffD(sDate(lin[0]),addWork(sDate(end),S.bottomLinerDays))<=0) break;
            slots=findSlots(nextDayAM(slots[0]),n,t.m,job.id,!!t.sp,t.w,!!t.am);
          } }
      }
      if(t.t==="Bond Coat" && S.bondPlasterGap>=0 && slots){
        // bond coat goes on the day before plaster, a one day gap at most
        const pl=tasks.find(x=>x.t==="Plaster");
        if(pl){ const pn=slotsFor(pl.d);
          for(let g=0; g<150 && slots; g++){
            const end=slots[slots.length-1]; let pi=nextDayAM(end);
            for(let h=0; h<400 && pi<N && !subFits(pi,pn,pl.w,!!S.onePlaster,true); h++) pi++;
            if(pi<N && diffD(sDate(pi),addWork(sDate(end),1+S.bondPlasterGap))<=0) break;
            slots=findSlots(nextDayAM(slots[0]),n,t.m,job.id,!!t.sp,t.w,!!t.am);
          } }
      }
      EXTRA=0; LOCK=null; NEEDCASEY=false; CARRY=false;
      let bfOver=false;
      if(TIGHT(t)>0 && slots){
        // walls are never left open: backfill goes in within a week of the
        // step before it, even if that day goes over the crew
        const due=dueOf(t,sDate(Math.max(0,cur-1)));
        if(diffD(sDate(slots[0]),due)>0){
          // pick the start inside the window that puts the fewest men over,
          // never on a day too cold for a concrete step
          let best=-1, bestOver=Infinity;
          for(let i2=from; i2<N && diffD(sDate(i2),due)<=0; i2++){
            if(n>=2 && sHalf(i2)!==0 && !(t.carry && n===2 && i2+1<N && sDate(i2+1)===addD(sDate(i2),1))) continue;
            let worst=0, cold=false;
            for(let k2=0;k2<n && i2+k2<N;k2++){
              if(COLD(t.w,i2+k2)) cold=true;
              const cz2=(S.caseyOnCall && !casey[i2+k2])?1:0;
              const ex2=Math.max(bigDay(t)?(S.bottomExtra||0):0, pbSlot[i2+k2]?(S.bottomExtra||0):0);
              worst=Math.max(worst, men[i2+k2]+t.m-Math.min(capOn(sDate(i2+k2))+ex2+cz2, S.hardMax||99));
            }
            if(t.warmNext && S.collarDays>0){ const nx=Math.min(N-1,(((i2+n-1)>>1)+1)*2);
              if(COLD("CONCRETE",nx) || sDate(nx)!==addD(sDate(i2+n-1),1)) cold=true; }
            if(!cold && worst<bestOver){ bestOver=worst; best=i2; }
          }
          // the crew limit wins over a timing rule: only use a day that fits
          if(best>=0 && bestOver<=0){
            slots=[]; for(let k2=0;k2<n && best+k2<N;k2++) slots.push(best+k2);
          }
          // only a real miss (no day fits, or it would put the crew over) pushes the start
          if(best<0 || bestOver>0) job._bfOver=true;
          job._bfWhy = t.t==="Backfill" ? "backfill can follow within a week"
            : t.tight==="collar" ? "the collar can pour the day after walls"
            : t.tight==="next" ? t.t.toLowerCase()+" can follow by the next workday"
            : t.tight==="steel" ? "steel can follow the gravel within a week"
            : t.warmNext ? "walls can go up within a week of digging with a pour day right after"
            : "the step after digging follows within a week";
        }
      }
      if(!slots){ out.push(mk(job,t,null,"LABOR","Beyond horizon",reason,t)); continue; }
      // open crew can join some steps: same man-hours, done sooner, never a later start
      const xmap=S.extraMen||{};
      const xm=(xmap[job.type+":"+t.t]!=null?xmap[job.type+":"+t.t]:xmap[t.t])||0;
      if(xm>0 && !bfOver && job.useExtra){
        let bestS=null, bestT=null;
        for(let k=xm;k>=1;k--){
          const m2=t.m+k, d2=Math.max(.5,Math.ceil(t.d*t.m/m2*2)/2);
          if(d2>=t.d) continue;
          EXTRA = bigDay(t) ? (S.bottomExtra||0) : 0; LOCK=needLock; NOCASEY=true; CARRY=!!t.carry;
          const s2=findSlots(from,slotsFor(d2),m2,job.id,!!t.sp,t.w,!!t.am);
          EXTRA=0; LOCK=null; NOCASEY=false; CARRY=false;
          if(s2 && s2[0]<=slots[0] && s2[s2.length-1]<slots[slots.length-1] &&
             (!bestS || s2[s2.length-1]<bestS[bestS.length-1])){ bestS=s2; bestT=Object.assign({},t,{m:m2,d:d2,_xm:k}); }
        }
        if(bestS){ slots=bestS; t=bestT; }
      }
      takeAll(slots,t.m,job.id);
      if(needLock) holdLock(needLock,slots);
      if(t._cz) holdCasey(slots);
      const st=sDate(slots[0]);
      const gap=diffD(st,sDate(Math.min(cur,N-1)));
      let status="Scheduled", note="";
      if(gap>=5 && reason==="Temperature window"){ status="Weather Hold"; note="Held "+gap+" days for temperature"; }
      else if(t.w==="CONCRETE" && gap>=1 && coldBy && (()=>{ let c=sDate(Math.min(cur,N-1));
          while(diffD(c,st)<0){ if(coldBy[c]) return true; c=addD(c,1);} return false; })()){
        note="Waited "+gap+" days for a day warm enough to pour"; }
      else if(gap>=3){ note="Waited "+gap+" days ("+(reason||"crew capacity")+")"; }
      if(cold) note=(note?note+" | ":"")+"Cold window, duration stretched";
      if(t.sp && slots[slots.length-1]-slots[0]+1>n) note=(note?note+" | ":"")+"Split around other work";
      if(job._bfOver && (isManual(job)||job.inProgress) && TIGHT(t)>0) note=(note?note+" | ":"")+"Could not meet its timing rule without going over the crew";
      if(t._xm) note=(note?note+" | ":"")+"+"+t._xm+" from the open crew to finish sooner";
      if(bfOver) note=(t.t==="Backfill"?"Backfill within "+TIGHT(t)+" days":t.tight==="collar"?"Collar by the next workday after walls":
        t.tight==="next"?t.t+" by the next workday":
        "Right after digging within "+TIGHT(t)+" days")+" rule: put in on time even though the crew is full";
      const r=mk(job,t,slots,"LABOR",status,note,t);
      if(t._cz) r.casey=true;
      out.push(r);
      if(!firstRow){ firstRow=r; firstReason=reason||""; }
      if(t.t==="Pour Coping") pcFin=r.finish;
      if(bigDay(t)) markBig(slots);
      if(t.t==="Liner Install") fillReady=Math.min(N-1,nextDayAM(slots[slots.length-1])+1);  // afternoon of the next workday
      if(t.liner) linerReady=linerFrom(r.finish);
      if(!t.liner) cur=slots[slots.length-1]+1;   // measuring runs alongside the next steps
      if(t.t==="Pull Lights" && linerReady){
        const li=idxOnAfter(addD(linerReady[1],1)); if(li>cur) cur=li;
      }
    }

    if(layoutRow && firstRow){
      let back=firstRow.start,c=0;
      while(c<S.layoutLead){ back=addD(back,-1); const w=sd(back).getDay();
        if(w!==0&&w!==6&&!blocked[back]) c++; }
      const lf=(job.force||{})["Layout"]||(job.pins||{})["Layout"];
      let li=idxOnAfter(lf ? (lf>today?lf:today) : (back>today?back:today)),g=0;
      const digAt=(firstRow.slots&&firstRow.slots.length)?firstRow.slots[0]:idxOnAfter(firstRow.start);
      const t0=idxOnAfter(today);
      NEEDCASEY=!!S.caseyLayout;
      // layout has to come before the dig: look forward up to the dig, then back toward today
      if(S.caseyLayout){
        if(!(job.force||{})["Layout"]) while(g++<40000 && li<digAt && blockAt(li,1,job.id)) li++;
        if(li>=digAt && !(job.force||{})["Layout"]){ li=Math.min(idxOnAfter(back>today?back:today),digAt)-1;
          while(li>=t0 && blockAt(li,1,job.id)) li--;
          if(li<t0) li=Math.max(t0,digAt-1); }
      } else {
        // an hour in the afternoon: no crew held, can share the dig day
        if(li>digAt) li=digAt;
        if(sHalf(li)===0 && li+1<N) li=li+1;
      }
      NEEDCASEY=false;
      if(li<N){ if(S.caseyLayout){ take(li,1,job.id); holdCasey([li]); } layoutRow.slots=[li];
        layoutRow.casey=!!S.caseyLayout;
        if(!S.caseyLayout){ layoutRow.men=0; layoutRow.note="About an hour, afternoon. Casey and Corbin."; }
        layoutRow.start=sDate(li); layoutRow.finish=sDate(li);
        layoutRow.sh=sHalf(li); layoutRow.fh=sHalf(li);
        layoutRow.days=[sDate(li)]; }
    } else if(layoutRow){ layoutRow.status="Completed"; layoutRow.cat="DONE"; }

    const real=out.filter(r=>r.start && !r.tpl.layout && r.cat!=="DONE");
    job._meta={plannedStart:real.length?real.map(r=>r.start).sort()[0]:null,
      plannedFinish:real.length?real.map(r=>r.finish).sort().slice(-1)[0]:null,
      variance:null, reason:firstReason};
    if(job._meta.plannedStart && job.targetStart)
      job._meta.variance=diffD(job._meta.plannedStart,job.targetStart);
      // with a promised window, late means after the window closes
      if(job.windowEnd) job._meta.windowLate=Math.max(0,diffD(job._meta.plannedStart,job.windowEnd));
    return out;
  }

  function mk(job,t,slots,cat,status,note,tpl){
    const r={jobId:job.id, job:job.name, type:job.type, ac:!!job.autoCover, task:t.t,
      dur:t.d, men:t.c==="LABOR"?t.m:0, cat:cat, w:t.w, status:status, note:note,
      tpl:tpl||t, start:null, finish:null, sh:0, fh:1, days:[]};
    if(slots && slots.length){
      r.slots=slots.slice();
      r.start=sDate(slots[0]); r.finish=sDate(slots[slots.length-1]);
      r.sh=sHalf(slots[0]); r.fh=sHalf(slots[slots.length-1]);
      r.days=slots.map(sDate);
    }
    return r;
  }
  function mkSpan(job,t,a,b,cat,status,note){
    const r=mk(job,t,null,cat,status,note,t);
    r.start=a; r.finish=b; r.sh=0; r.fh=1; return r;
  }

  // explicit hold rows
  const final=[], byJob={};
  rows.forEach(r=>{ (byJob[r.jobId]=byJob[r.jobId]||[]).push(r); });
  for(const id of Object.keys(byJob)){
    let prev=null;
    for(const r of byJob[id]){
      if(r.start && prev && diffD(r.start,prev)>=10 && r.cat!=="WAIT"){
        const weather = r.w!=="NONE" || r.status==="Weather Hold";
        final.push({jobId:r.jobId, job:r.job, type:r.type, ac:r.ac,
          task: weather?"Weather hold":"Schedule hold", dur:diffD(r.start,prev),
          men:0, cat:"HOLD", w:r.w, start:addD(prev,1), finish:addD(r.start,-1),
          sh:0, fh:1, days:[], status: weather?"Weather Hold":"Waiting / Crew",
          note:"Paused. Uses no labor.", tpl:{}});
      }
      if(r.status==="Weather Hold" && r.cat==="LABOR") r.status="Resumes after hold";
      final.push(r);
      if(r.finish && !(r.tpl&&r.tpl.layout) && (!prev || diffD(r.finish,prev)>0)) prev=r.finish;
    }
  }
  return {rows:final, men, casey, wd, blocked};
}

/* per-day labor load, counted from the exact half-day slots a task occupies */
function dayLoad(rows,dateStr){
  const out={}; let total=0;
  for(const r of rows){
    if(r.cat!=="LABOR"||!r.days||!r.days.length) continue;
    let slots=0;
    for(const d of r.days) if(d===dateStr) slots++;
    if(!slots) continue;
    const load=r.men*slots/2;
    if(!out[r.jobId]) out[r.jobId]={men:0,tasks:[],forced:false};
    out[r.jobId].men+=load;
    out[r.jobId].tasks.push(r.task);
    if(r.forced) out[r.jobId].forced=true;
    total+=load;
  }
  return {byJob:out,total:total};
}

const App = {
  db:null, user:null, dl:null, canEdit:false,
  committed:{jobs:[],cfg:{},cal:{},crew:{},triggers:[]},   // last saved
  staged:{jobs:[],cfg:{},cal:{},crew:{},triggers:[]},      // working copy
  baseline:{},                          // approved schedule: key -> start
  sched:{rows:[]}, tab:"board", sample:null, chat:[], chatBusy:false, archived:[],
  boardStart:todayStr(), ready:false
};
const clone=o=>JSON.parse(JSON.stringify(o));
const key=r=>r.jobId+"|"+r.task;

function reserveDays(cfg,fromStr,months){
  // Spread expected lost days evenly through each month, but ONLY beyond the
  // forecast horizon. Inside it you can look up the weather, so a statistical
  // reserve day would be worse information than reality.
  const S=Object.assign({},DEFAULTS,cfg||{});
  const firm=addD(todayStr(), S.reserveFrom||0);
  const out={}; const d0=sd(fromStr);
  for(let mi=0; mi<months; mi++){
    const d=new Date(d0.getFullYear(), d0.getMonth()+mi, 1);
    const mo=d.getMonth()+1;
    const events=(mo>=3&&mo<=6)?S.rainSpring:S.rainOther;
    const n=Math.round(events*S.rainImpact);
    if(n<=0) continue;
    const cands=[];
    const last=new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    for(let day=1; day<=last; day++){
      const c=new Date(d.getFullYear(),d.getMonth(),day);
      if(c.getDay()!==0&&c.getDay()!==6) cands.push(ds(c));
    }
    if(!cands.length) continue;
    const step=cands.length/n;
    for(let k=0;k<n;k++){
      const idx=Math.min(cands.length-1,Math.max(0,Math.round(step*(k+0.5))-1));
      if(diffD(cands[idx],firm)>=0) out[cands[idx]]={type:"reserve",note:"Weather reserve"};
    }
  }
  return out;
}
function blockedMap(){
  const m=reserveDays(App.staged.cfg, addD(todayStr(),-40), 30);
  for(const [d,v] of Object.entries(App.staged.cal||{})){
    if(!v||!v.type||v.type==="cold"||v.type==="warm") continue;   // concrete-only, handled below
    if(v.type==="clear") delete m[d];
    else m[d]=v;
  }
  return m;
}
function coldDays(cfg,fromStr,months){
  // Days too cold to pour (high under 40F or overnight under 25F). From the last
  // three Kansas City winters at KCI: Dec 58%, Jan 26%, Feb 61%, Mar 91% of workdays
  // were warm enough. Spread evenly beyond the forecast horizon; not a forecast.
  const S=Object.assign({},DEFAULTS,cfg||{});
  const pct={12:S.warmDec,1:S.warmJan,2:S.warmFeb,3:S.warmMar};
  const firm=addD(todayStr(), S.reserveFrom||0);
  const out={}; const d0=sd(fromStr);
  for(let mi=0; mi<months; mi++){
    const d=new Date(d0.getFullYear(), d0.getMonth()+mi, 1);
    const mo=d.getMonth()+1;
    if(pct[mo]==null) continue;
    const cands=[], last=new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    for(let day=1; day<=last; day++){
      const c=new Date(d.getFullYear(),d.getMonth(),day);
      if(c.getDay()!==0&&c.getDay()!==6) cands.push(ds(c));
    }
    const n=Math.round((1-Math.max(0,Math.min(100,+pct[mo]))/100)*cands.length);
    if(n<=0) continue;
    const step=cands.length/n;
    for(let k=0;k<n;k++){
      const idx=Math.min(cands.length-1,Math.max(0,Math.floor(step*(k+0.5))));
      if(diffD(cands[idx],firm)>=0) out[cands[idx]]={type:"cold",est:true};
    }
  }
  return out;
}
function coldMap(){
  const m=coldDays(App.staged.cfg, addD(todayStr(),-40), 30);
  for(const [d,v] of Object.entries(App.staged.cal||{})){
    if(v&&v.type==="cold") m[d]={type:"cold",note:v.note||""};
    else if(v&&v.type==="warm") delete m[d];
  }
  return m;
}
function crewOn(dstr){
  const cfg=Object.assign({},DEFAULTS,App.staged.cfg||{});
  let c=(App.staged.crew||{})[dstr];
  if(c && typeof c==="object") c=c.men;
  return (c==null||c===""||isNaN(+c))?cfg.crew:+c;
}
function recompute(){
  App._blocked = blockedMap();
  App._cold = coldMap();
  App.sched = runSchedule(App.staged.jobs, App.staged.cfg, App._blocked, App.staged.crew||{}, App._cold);
}
function currentMap(){
  const m={};
  for(const r of App.sched.rows) if(r.cat!=="HOLD"&&r.start) m[key(r)]=r.start;
  return m;
}
function diffRows(){
  const cur=currentMap(), out=[];
  for(const k of Object.keys(cur)){
    const was=App.baseline[k];
    if(was===undefined) out.push({k,type:"new",now:cur[k]});
    else if(was!==cur[k]) out.push({k,type:"moved",was,now:cur[k],delta:diffD(cur[k],was)});
  }
  for(const k of Object.keys(App.baseline)) if(cur[k]===undefined) out.push({k,type:"gone",was:App.baseline[k]});
  return out;
}
function isDirty(){
  // _meta is the schedule's own working notes on each job, never saved, so it isn't a change
  const plain=o=>JSON.stringify(o,(k,v)=>k==="_meta"?undefined:v);
  return plain(App.staged)!==plain(App.committed) || diffRows().length>0;
}
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2200);
}

async function loadAll(){
  if(!App.db) return;
  try{
    const [cfgS, calS, baseS, jobsS, trgS] = await Promise.all([
      App.db.doc("config/settings").get(),
      App.db.doc("config/calendar").get(),
      App.db.doc("config/baseline").get(),
      App.db.collection("jobs").get(),
      App.db.doc("config/triggers").get()
    ]);
    App.committed.triggers = trgS.exists ? (trgS.data().list||[]) : [];
    App.committed.cfg = cfgS.exists ? (cfgS.data().cfg||{}) : {};
    App.committed.cal = calS.exists ? (calS.data().days||{}) : {};
    App.committed.crew = calS.exists ? (calS.data().crew||{}) : {};
    const allJobs = jobsS.docs.map(d=>Object.assign({id:d.id}, d.data()));
    App.archived = allJobs.filter(j=>j.status==="archived");
    App.committed.jobs = allJobs.filter(j=>j.status!=="archived");
    const b = baseS.exists ? (baseS.data().rows||[]) : null;
    App.baseline = {};
    if(b) for(const [k,v] of b) App.baseline[k]=v;
    App.staged = clone(App.committed);
    recompute();
    if(!b) App.baseline = currentMap();   // first run: adopt what we computed
  }catch(e){ console.warn("load failed",e); }
}
async function saveAll(){
  if(!App.db){ toast("Not connected, nothing saved"); return false; }
  try{
    // Save only what changed on this screen, so an older screen can never write
    // stale copies over someone else's newer changes.
    // Compare whole pools, nested dates and to-dos included, with keys in a fixed order.
    // (Sorting only the top-level keys used to hide changes inside force, pins and done.)
    const stable=v=>Array.isArray(v)?"["+v.map(stable).join(",")+"]"
      : (v&&typeof v==="object")?"{"+Object.keys(v).sort().filter(k=>v[k]!==undefined)
          .map(k=>JSON.stringify(k)+":"+stable(v[k])).join(",")+"}"
      : JSON.stringify(v===undefined?null:v);
    const strip=j=>{ const b=clone(j); delete b._meta; return stable(b); };
    const was={}; App.committed.jobs.forEach(j=>was[j.id]=strip(j));
    const changed=App.staged.jobs.filter(j=>was[j.id]!==strip(j));
    const ids=new Set(App.staged.jobs.map(j=>j.id));
    const removed=App.committed.jobs.filter(j=>!ids.has(j.id));
    // Apply only the fields changed on this screen on top of the latest saved copy,
    // so a newer change made elsewhere is kept and no pop-up is needed.
    const old={}; App.committed.jobs.forEach(j=>old[j.id]=j);
    const same=(a,b)=>JSON.stringify(a===undefined?null:a)===JSON.stringify(b===undefined?null:b);
    for(const j of removed) await App.db.doc("jobs/"+j.id).delete();
    for(const j of changed){
      const mine=clone(j); delete mine.id; delete mine._meta;
      const before=old[j.id];
      let body=mine;
      if(before){
        const snap=await App.db.doc("jobs/"+j.id).get();
        if(snap.exists){
          const latest=snap.data(); body=clone(latest);
          const keys=new Set(Object.keys(mine).concat(Object.keys(before)));
          keys.forEach(k=>{
            if(k==="id"||k==="_meta") return;
            if(same(mine[k],before[k])) return;                 // not touched here: keep the latest
            const isMap=v=>v&&typeof v==="object"&&!Array.isArray(v);
            if(isMap(mine[k]) && isMap(before[k]) && isMap(latest[k])){
              const m=clone(latest[k]);                          // merge maps (hand dates, to-dos) key by key
              new Set(Object.keys(mine[k]).concat(Object.keys(before[k]))).forEach(q=>{
                if(same(mine[k][q],before[k][q])) return;
                if(mine[k][q]===undefined) delete m[q]; else m[q]=mine[k][q];
              });
              body[k]=m;
            } else if(mine[k]===undefined) delete body[k];
            else body[k]=mine[k];
          });
        }
      }
      await App.db.doc("jobs/"+j.id).set(body);
    }
    if(JSON.stringify(App.staged.cfg||{})!==JSON.stringify(App.committed.cfg||{}))
      await App.db.doc("config/settings").set({cfg:App.staged.cfg||{}});
    if(JSON.stringify(App.staged.cal||{})!==JSON.stringify(App.committed.cal||{}) ||
       JSON.stringify(App.staged.crew||{})!==JSON.stringify(App.committed.crew||{}))
      await App.db.doc("config/calendar").set({days:App.staged.cal||{}, crew:App.staged.crew||{}});
    if(JSON.stringify(App.staged.triggers||[])!==JSON.stringify(App.committed.triggers||[]))
      await App.db.doc("config/triggers").set({list:App.staged.triggers||[]});
    // reload so this screen shows exactly what is saved, then record the approved dates
    await loadAll();
    const cur=currentMap();
    await App.db.doc("config/baseline").set({rows:Object.keys(cur).map(k=>[k,cur[k]]), savedAt:new Date().toISOString()});
    App.baseline=cur;
    return true;
  }catch(e){
    console.warn(e);
    toast(e && e.code==="invalid_argument" ? "You have view-only access" : "Save failed, try again");
    return false;
  }
}

const el=(t,c,x)=>{const e=document.createElement(t); if(c)e.className=c;
  if(x!=null)e.textContent=x; return e;};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

const TABS=[["board","Board"],["pipeline","Pipeline"],["schedule","Job progress"],["moves","Moved dates"],
            ["calendar","Lost days"],["outlook","Long range"],
            ["settings","Rules"],["help","How it works"]];
function renderTabs(){
  const n=document.getElementById("tabs"); n.innerHTML="";
  // view-only staff get the calendar alone, with no other board tabs
  n.style.display=App.canEdit?"":"none";
  if(!App.canEdit){ App.tab="board"; return; }
  for(const [id,label] of TABS){
    const b=el("button",null,label);
    b.setAttribute("role","tab");
    b.setAttribute("aria-selected", App.tab===id?"true":"false");
    b.onclick=()=>{App.tab=id; render();};
    n.appendChild(b);
  }
}
function workableDays(from,n,blocked){
  // contract term: days on which work could be performed. Weekends and observed
  // holidays do not count. Weather days are handled by the extension clause, so
  // counting them here too would be double counting.
  let c=0,d=from,g=0;
  while(c<n && g++<4000){
    d=addD(d,1);
    const w=sd(d).getDay();
    const b=blocked[d];
    if(w!==0 && w!==6 && !(b && b.type==="holiday")) c++;
  }
  return d;
}
function delayDaysBetween(a,b,blocked){
  // Force majeure days that actually happened. A reserved day is a planning
  // allowance, not a delay that occurred, so it can never earn a contract
  // extension. Holidays are not force majeure either.
  let n=0,d=a,g=0;
  while(diffD(d,b)<=0 && g++<4000){
    const w=sd(d).getDay(), bl=blocked[d];
    if(w!==0 && w!==6 && bl && bl.type!=="holiday" && bl.type!=="reserve") n++;
    d=addD(d,1);
  }
  return n;
}
function firmThrough(){
  const cfg=Object.assign({},DEFAULTS,App.staged.cfg||{});
  return addD(todayStr(), (cfg.reserveFrom||0)-1);
}
function promiseFor(j){
  if(j.type==="oneoff" || (j.type==="renovation" && (j.promiseDays==null||j.promiseDays===""))) return {};
  const cfg=Object.assign({},DEFAULTS,App.staged.cfg||{});
  const days=(j.promiseDays!=null && j.promiseDays!=="") ? +j.promiseDays
            : (j.type==="vinyl"?cfg.promiseVinyl:cfg.promiseGunite);
  const m=j._meta||{};
  const blocked=App._blocked||{};
  let clock=j.contractStart||null;
  if(!clock && cfg.clockStart==="excavation"){
    const ex=(App.sched.rows||[]).find(r=>r.jobId===j.id && r.task==="Excavation" && r.start);
    if(ex) clock=ex.start;
  }
  if(!clock) clock=m.plannedStart||null;
  const out={days, from:clock, base:null, delay:0, ext:0, due:null,
             plain:null, over:null, gap:null};
  if(!clock) return out;
  out.base = cfg.promiseBasis==="workable" ? workableDays(clock,days,blocked) : addD(clock,days);
  out.plain = addD(clock,days);          // what a customer hears if told "60 days"
  if(m.plannedFinish){
    out.delay = delayDaysBetween(clock,m.plannedFinish,blocked);
    out.ext = Math.min(out.delay,cfg.extTier)*cfg.extRate1
            + Math.max(0,out.delay-cfg.extTier)*cfg.extRate2;
    out.due = addD(out.base,out.ext);
    out.over = diffD(m.plannedFinish,out.due);      // contract exposure
    out.gap  = diffD(m.plannedFinish,out.plain);    // expectation exposure
    // Days the pool is parked only because the season will not allow liner,
    // plaster or plaster prep. Those are weather, not a schedule failure, so
    // they are taken out before anything is flagged.
    out.wx = windowWaitDays(j);

function windowWaitDays(j){
  const rows=(App.sched.rows||[]).filter(r=>r.jobId===j.id && r.cat!=="HOLD");
  const WIN={LINER:DEFAULTS.linerWin, PLASTER:DEFAULTS.plasterWin, PREP:DEFAULTS.prepWin};
  const days=new Set(); let ready=null;
  rows.forEach(r=>{
    if(r.start && WIN[r.w] && ready){
      let c=addD(ready,1);
      while(diffD(c,r.start)<0){ if(!mdInWindow(c,WIN[r.w])) days.add(c); c=addD(c,1); }
    }
    if(r.finish && (!ready || diffD(r.finish,ready)>0)) ready=r.finish;
  });
  return days.size;
}
function finishRisk(j){
  const p=promiseFor(j);
  if(p.over==null)   return ["","pill mut",p];
  if(p.overFlag>0)   return ["BREACH +"+p.overFlag+"d","pill bad",p];
  if(p.gapFlag>30)   return ["Expect a call","pill warn",p];
  if(p.overFlag>-10 && !(p.wx>0)) return ["Tight","pill warn",p];
  if(p.wx>0 && (p.over>0 || p.gap>30)) return ["Season wait","pill mut",p];
  return ["Covered","pill ok",p];
}

function triggerItems(){
  const out=[];
  (App.staged.triggers||[]).forEach(tr=>{
    App.staged.jobs.forEach(j=>{
      if(tr.types && tr.types.length && tr.types.indexOf(j.type)<0) return;
      if(tr.needs==="ac" && !j.autoCover) return;
      if(tr.needs==="spa" && !j.spa) return;
      if(tr.needs==="sump" && !j.sump) return;
      if(tr.needs==="waterFeature" && !j.waterFeature) return;
      if(tr.needs==="heater2" && !j.heater2) return;
      const r=App.sched.rows.find(x=>x.jobId===j.id && x.task===tr.task && x.start && x.cat!=="DONE");
      if(!r) return;                                  // step already done, or not on this pool
      const base = tr.when==="finish" ? r.finish : r.start;
      let due=addD(base,+tr.offset||0);
      if((+tr.offset||0)<0){   // "a day before" means the workday before
        due=base; let k=-(+tr.offset), g=0;
        while(k>0 && g++<60){ due=addD(due,-1); const w=sd(due).getDay();
          if(w!==0 && w!==6 && !(App._blocked&&App._blocked[due]&&App._blocked[due].type==="holiday")) k--; }
      }
      out.push({jobId:j.id, pool:j.name, trig:tr, due:due,
                done:!!(j.done||{})[tr.id], step:r.task, stepDate:r.start});
    });
  });
  return out.sort((a,b)=>a.due.localeCompare(b.due));
}

// Earliest starts for new pools of one type that do not move any existing pool.
// Each candidate is slotted in normally (by its date); it fits if no real pool starts
// later or finishes more than 2 days later and no new over-crew day appears.
function findOpenSlots(type, jobsIn, cfg, blocked, crew, cold, count, done){
  const today=todayStr(), found=[];
  const snap=jobs=>{ const m={}; jobs.forEach(j=>{ if(!j.hypo && j.status!=="archived") m[j.id]=j._meta||{}; }); return m; };
  const overCount=rows=>{ const seen={}; let n=0;
    rows.forEach(r=>{ if(r.cat==="LABOR"&&r.days) r.days.forEach(d=>{ seen[d]=1; }); });
    return Object.keys(seen).filter(d=>dayLoad(rows,d).total>((cfg&&cfg.crew)||8)+2.01).length; };
  const mk=(i,date)=>({id:"hypo_"+type+i, name:"Next "+type+" "+i, type:type, autoCover:true, targetStart:date,
    order:900+i, overrides:{}, pins:{}, force:{}, inProgress:false, hypo:false, _probe:true});
  let base=JSON.parse(JSON.stringify(jobsIn)); let baseRows=runSchedule(base,cfg,blocked,crew,cold).rows;
  let baseSnap=snap(base), baseOver=overCount(baseRows);
  // first guess: where a pool would land behind everyone
  for(let i=1;i<=count;i++){
    let guess;
    { const t=JSON.parse(JSON.stringify(base)); const h=mk(i,today); h.hypo=true; t.push(h);
      runSchedule(t,cfg,blocked,crew,cold); guess=(t.find(x=>x.id===h.id)._meta||{}).plannedStart||today; }
    let pick=null;
    for(let step=0; step<52 && !pick; step++){
      const date=addD(guess, step*7);
      const t=JSON.parse(JSON.stringify(base)); t.push(mk(i,date));
      const rows=runSchedule(t,cfg,blocked,crew,cold).rows;
      const ok=Object.keys(baseSnap).every(id=>{ const a=baseSnap[id], b=(t.find(x=>x.id===id)||{})._meta||{};
        if(!a.plannedStart||!b.plannedStart) return true;
        return diffD(b.plannedStart,a.plannedStart)<=0 && diffD(b.plannedFinish||a.plannedFinish,a.plannedFinish||b.plannedFinish)<=2; })
        && overCount(rows)<=baseOver;
      if(ok){ const m=t.find(x=>x.id==="hypo_"+type+i)._meta||{};
        pick={start:m.plannedStart, finish:m.plannedFinish, job:t.find(x=>x.id==="hypo_"+type+i)}; }
    }
    if(!pick){ found.push({start:null,finish:null}); continue; }
    found.push({start:pick.start, finish:pick.finish});
    // lock this slot in before looking for the next one
    const keep=Object.assign({},pick.job); delete keep._meta; keep.targetStart=pick.start;
    base.push(keep); baseRows=runSchedule(base,cfg,blocked,crew,cold).rows; baseSnap=snap(base); baseOver=overCount(baseRows);
    if(done) done(found.slice());
  }
  return found;
}
// Which pools can open ahead of their turn without hurting anyone: try each pool in
// line order; keep it only if it starts sooner, its own build takes no longer than in its
// normal turn (no hole left sitting), and no pool starts later or finishes more than
// 2 days later than in the current schedule.
function findEarlyOpenings(jobsIn, cfg, blocked, crew, cold){
  const run=js=>runSchedule(js,cfg,blocked,crew,cold);
  const base=JSON.parse(JSON.stringify(jobsIn)); base.forEach(j=>{ delete j.openEarly; }); run(base);
  const ref={}; base.forEach(j=>{ ref[j.id]=j._meta||{}; });
  const order=base.filter(j=>(j.type==="vinyl"||j.type==="gunite") && !j.inProgress && j.status!=="archived" &&
      !(j.holdUntil && diffD(j.holdUntil,todayStr())>0) && (j._meta||{}).plannedStart)
    .sort((a,b)=>String(ref[a.id].plannedStart).localeCompare(String(ref[b.id].plannedStart)));
  const accepted=[];
  let cur=ref;
  for(const cand of order){
    const t=JSON.parse(JSON.stringify(jobsIn)); t.forEach(j=>{ delete j.openEarly; if(accepted.indexOf(j.id)>=0||j.id===cand.id) j.openEarly=true; });
    run(t);
    const mine=t.find(j=>j.id===cand.id)._meta||{};
    if(!mine.plannedStart || diffD(mine.plannedStart,cur[cand.id].plannedStart)>=0) continue;   // no gain
    // never an open hole left sitting: the build may not take longer than in its normal turn
    const durNow=diffD(cur[cand.id].plannedFinish||cur[cand.id].plannedStart, cur[cand.id].plannedStart);
    const durEarly=diffD(mine.plannedFinish||mine.plannedStart, mine.plannedStart);
    if(durEarly>durNow+3) continue;
    const ok=t.every(j=>{ const a=ref[j.id], b=j._meta||{};
      if(!a||!a.plannedStart||!b.plannedStart) return true;
      return diffD(b.plannedStart,a.plannedStart)<=0 && diffD(b.plannedFinish||b.plannedStart,a.plannedFinish||a.plannedStart)<=2; });
    if(ok){ accepted.push(cand.id); cur={}; t.forEach(j=>{ cur[j.id]=j._meta||{}; }); }
  }
  return accepted;
}
// Which pools can use extra hands from the open crew without hurting anyone: try each
// pool in start order; keep it only if that pool finishes sooner and no pool starts
// later or finishes more than 2 days later.
function findExtraCrew(jobsIn, cfg, blocked, crew, cold){
  const run=js=>runSchedule(js,cfg,blocked,crew,cold);
  const base=JSON.parse(JSON.stringify(jobsIn)); base.forEach(j=>{ delete j.useExtra; }); run(base);
  const ref={}; base.forEach(j=>{ ref[j.id]=j._meta||{}; });
  const order=base.filter(j=>(j.type==="vinyl"||j.type==="gunite") && j.status!=="archived" && (j._meta||{}).plannedFinish)
    .sort((a,b)=>String(ref[a.id].plannedStart).localeCompare(String(ref[b.id].plannedStart)));
  const accepted=[]; let cur=ref;
  for(const cand of order){
    const t=JSON.parse(JSON.stringify(jobsIn)); t.forEach(j=>{ delete j.useExtra; if(accepted.indexOf(j.id)>=0||j.id===cand.id) j.useExtra=true; });
    run(t);
    const mine=t.find(j=>j.id===cand.id)._meta||{};
    if(!mine.plannedFinish || diffD(mine.plannedFinish,cur[cand.id].plannedFinish)>=0) continue;
    const ok=t.every(j=>{ const a=ref[j.id], b=j._meta||{};
      if(!a||!a.plannedStart||!b.plannedStart) return true;
      return diffD(b.plannedStart,a.plannedStart)<=0 && diffD(b.plannedFinish||b.plannedStart,a.plannedFinish||a.plannedStart)<=2; });
    if(ok){ accepted.push(cand.id); cur={}; t.forEach(j=>{ cur[j.id]=j._meta||{}; }); }
  }
  return accepted;
}
/* ---------- BOARD: two weeks, drag to move ---------- */
function mondayOf(str){ const d=sd(str); const off=(d.getDay()+6)%7; return addD(str,-off); }
function idleLook(days){
  // Eight men are paid whether or not they are on a pool, so unused capacity
  // is the cost worth flagging, not overload.
  const out=[];
  const start=mondayOf(todayStr());
  for(let i=0;i<days;i++){
    const d=addD(start,i), w=sd(d).getDay();
    if(w===0||w===6) continue;
    if(diffD(d,todayStr())<0) continue;
    if(App._blocked[d]) continue;
    const cap=crewOn(d), A=dayAssignments(d);
    const free=Math.round((cap-A.total)*10)/10;
    if(free>=2) out.push({date:d, free, cap, used:A.total, pull:pullCandidates(d,free)});
  }
  return out;
}
function pullCandidates(dstr,free){
  // Only from a pool NOT already working that day. You cannot tie steel on the
  // same day you set gravel, and a pool already on site is already using crew.
  const hits=[];
  const busy=new Set(dayAssignments(dstr).list.map(a=>a.id));
  const byJob={};
  App.sched.rows.forEach(r=>{ if(r.cat==="LABOR") (byJob[r.jobId]=byJob[r.jobId]||[]).push(r); });
  Object.keys(byJob).forEach(id=>{
    if(busy.has(id)) return;
    const j=jobById(id); if(!j) return;
    const list=byJob[id].filter(r=>r.start).sort((a,b)=>a.start.localeCompare(b.start));
    const next=list.find(r=>diffD(r.start,dstr)>0);
    if(!next || next.men>free) return;
    const prior=list.filter(r=>diffD(r.start,dstr)<=0).slice(-1)[0];
    if(prior && diffD(prior.finish,dstr)>=0) return;   // predecessor must finish BEFORE this day
    const all=App.sched.rows.filter(r=>r.jobId===id);
    const wait=all.find(r=>r.cat==="WAIT"&&r.start&&diffD(dstr,r.start)>=0&&diffD(dstr,r.finish)<=0);
    if(wait) return;                                   // soaking or waiting on the liner
    if(next.w==="LINER"||next.w==="PLASTER"||next.w==="PREP"){
      const win=next.w==="LINER"?DEFAULTS.linerWin:next.w==="PLASTER"?DEFAULTS.plasterWin:DEFAULTS.prepWin;
      if(!mdInWindow(dstr,win)) return;
    }
    hits.push({kind:"pull", pool:j.name, task:next.task, men:next.men,
               was:next.start, gain:diffD(next.start,dstr)});
  });
  hits.sort((a,b)=>b.men-a.men);
  if(hits.length) return hits.slice(0,2);
  return fallbackIdeas(dstr,free);
}
function fallbackIdeas(dstr,free){
  const out=[];
  const busy=new Set(dayAssignments(dstr).list.map(a=>a.id));
  // a layout for an upcoming pool is one man and can happen any time
  const soon=App.staged.jobs.filter(isPool).filter(j=>{
    const m=j._meta||{};
    return m.plannedStart && diffD(m.plannedStart,dstr)>0 && diffD(m.plannedStart,dstr)<70;
  }).sort((a,b)=>String((a._meta||{}).plannedStart).localeCompare(String((b._meta||{}).plannedStart)));
  if(soon.length) out.push({kind:"idea",
    text:"Run layout for "+soon[0].name+" early. One man, two hours."});
  // an extra hand on a pool already going
  const here=[...busy].map(id=>(jobById(id)||{}).name).filter(Boolean);
  if(here.length && free>=2) out.push({kind:"idea",
    text:"Put the spare men on "+here[0]+" to get ahead, or send them to service."});
  out.push({kind:"idea", text:"Nothing is ready to pull forward. Good day for PTO, yard work, or equipment repair."});
  return out.slice(0,2);
}
function dayAssignments(dstr){
  const load=dayLoad(App.sched.rows,dstr);
  const list=Object.keys(load.byJob).map(id=>{
    const j=jobById(id);
    const rows=App.sched.rows.filter(r=>r.cat==="LABOR"&&r.days&&r.days.indexOf(dstr)>=0&&r.jobId===id);
    const items=rows.map(r=>{
      const slots=r.days.filter(d=>d===dstr).length;
      return {task:r.task, men:r.men, slots, part: slots>=2?"full day":"half day"};
    });
    return {id, name:j?j.name:id, men:load.byJob[id].men, items,
            crew: Math.max(0,...items.map(x=>x.men)),
            tasks:[...new Set(rows.map(r=>r.task))], forced:rows.some(r=>r.forced)};
  });
  const casey=App.sched.rows.filter(r=>(r.cat==="CASEY"||(r.casey&&r.days))&&r.start&&
    diffD(dstr,r.start)>=0&&diffD(dstr,r.finish)<=0&&(r.cat==="CASEY"||r.days.indexOf(dstr)>=0))
    .map(r=>r.cat==="CASEY"?r:Object.assign({},r,{task:r.task+" (with the crew)"}));
  return {list, casey, total:load.total};
}
function overCrewDays(){
  // workdays where the schedule asks for more men than the crew has. The
  // scheduler never does this on its own, so these come from hand moves or a
  // smaller crew set for a day. They are allowed, just flagged.
  const out=[], rows=App.sched.rows||[], seen={};
  rows.forEach(r=>{ if(r.cat==="LABOR"&&r.days) r.days.forEach(d=>{ seen[d]=1; }); });
  Object.keys(seen).sort().forEach(d=>{
    if(diffD(d,todayStr())<0) return;
    const L=dayLoad(rows,d), cap=capFor(d);
    if(L.total>cap+0.01) out.push({date:d,total:Math.round(L.total*10)/10,cap:cap,
      note:L.total>10.01?(Math.round(L.total*10)/10)+" men, more than 10 can never be in the field":null});
  });
  // Corbin runs every dig, so two digs on the same day is flagged too
  const cfg=Object.assign({},DEFAULTS,App.staged.cfg||{});
  if(cfg.oneDig){
    const dig={};
    rows.filter(r=>r.task==="Excavation"&&r.cat==="LABOR"&&r.days).forEach(r=>{
      [...new Set(r.days)].forEach(d=>{ (dig[d]=dig[d]||new Set()).add(r.job); }); });
    Object.keys(dig).sort().forEach(d=>{ if(diffD(d,todayStr())>=0 && dig[d].size>1)
      out.push({date:d, note:"Corbin is on two digs ("+[...dig[d]].join(" and ")+")"}); });
  }
  return out;
}
function baseCap(d){
  const cfg=Object.assign({},DEFAULTS,App.staged.cfg||{});
  const pb=(App.sched.rows||[]).some(r=>r.cat==="LABOR"&&(r.task==="Pool Bottom"||/plumb/i.test(r.task))&&r.days&&r.days.indexOf(d)>=0);
  return crewOn(d)+(pb?(cfg.bottomExtra||0):0);
}
function caseyBusy(d){
  return (App.sched.rows||[]).some(r=>(r.cat==="CASEY"&&r.start&&diffD(d,r.start)>=0&&diffD(d,r.finish)<=0)||
    (r.casey&&r.days&&r.days.indexOf(d)>=0));
}
function capFor(d){
  const cfg=Object.assign({},DEFAULTS,App.staged.cfg||{});
  return Math.min(baseCap(d)+((cfg.caseyOnCall && !caseyBusy(d))?1:0), cfg.hardMax||99);
}
function caseyIn(d,total){ return total>baseCap(d)+0.01 && total<=capFor(d)+0.01; }
function overText(o){ return wdShort(o.date)+" "+fmt(o.date)+": "+(o.note||(o.total+" men, crew is "+o.cap)); }
function wdShort(d){ return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][sd(d).getDay()]; }
function clearLaterDates(j,task,date){
  // later steps of this pool keep a hand date only if it still comes after the moved step
  const steps=taskList(j).map(t=>t.t); const at=steps.indexOf(task);
  if(at<0) return;
  steps.slice(at+1).forEach(t=>{
    ["force","pins"].forEach(f=>{ if(j[f] && j[f][t] && diffD(j[f][t],date)<0) delete j[f][t]; });
  });
}
/* ---------- MOVE REASONS ----------
   Every hand move asks why. The reason is kept on the pool as j.moves (a map by
   id, so two people's moves merge on save). When the change is approved, the
   schedule is rebuilt without the hand moves to find which other tasks shifted
   only because of them; those get j.shifted notes shown on the calendar. */
const MOVE_REASONS=["Better flow","Outside issue","Internal issue","Weather delay","Other"];
function askMoveReason(what,done){

function startOf(jobId,task){
  const r=App.sched.rows.find(x=>x.jobId===jobId&&x.task===task&&x.start); return r?r.start:null;
}
// kind: "date" (must run on), "notbefore", or "auto" (hand date cleared)
function recordMove(j,task,from,to,kind,why){
  j.moves=j.moves||{};
  // a second move of the same step before approving replaces the first, keeping its original date
  const ex=Object.keys(j.moves).find(k=>!j.moves[k].savedAt && j.moves[k].task===task);
  const id=ex||("m"+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
  j.moves[id]={task, from:ex?j.moves[ex].from:(from||null), to:to||null, kind,
    reason:why.reason, detail:why.detail||"", by:App.meName||"", at:new Date().toISOString()};
}
function moveToText(m){
  return m.kind==="date"?fmt(m.to):m.kind==="notbefore"?"not before "+fmt(m.to):"scheduler decides";
}
// On approve: stamp unsaved moves and work out the knock-on shifts. Returns an undo for a failed save.
function stampMoves(){
  const pend=[];
  App.staged.jobs.forEach(j=>Object.keys(j.moves||{}).forEach(id=>{ if(!j.moves[id].savedAt) pend.push({j,m:j.moves[id]}); }));
  if(!pend.length) return ()=>{};
  const ids=new Set(pend.map(p=>p.j.id));
  const committedJob=id=>App.committed.jobs.find(x=>x.id===id)||{};
  // the same schedule without these hand moves
  const alt=clone(App.staged.jobs).map(a=>{
    if(!ids.has(a.id)) return a;
    const c=committedJob(a.id); a.force=clone(c.force||{}); a.pins=clone(c.pins||{}); return a;
  });
  const altMap={};
  runSchedule(alt,App.staged.cfg,App._blocked,App.staged.crew||{},App._cold).rows
    .forEach(r=>{ if(r.cat!=="HOLD"&&r.start) altMap[key(r)]=r.start; });
  // steps whose hand dates changed are the moves themselves, not knock-ons
  const own=new Set();
  ids.forEach(id=>{ const s=jobById(id)||{}, c=committedJob(id);
    ["force","pins"].forEach(f=>{ const a=s[f]||{}, b=c[f]||{};
      new Set(Object.keys(a).concat(Object.keys(b))).forEach(k=>{ if(a[k]!==b[k]) own.add(id+"|"+k); }); }); });
  pend.forEach(p=>own.add(p.j.id+"|"+p.m.task));
  const cur=currentMap();
  const caused=Object.keys(cur).filter(k=>!own.has(k) && altMap[k]!==undefined && altMap[k]!==cur[k]).map(k=>{
    const [jid,task]=k.split("|"), jj=jobById(jid);
    return {jobId:jid, job:jj?jj.name:jid, task, was:altMap[k], now:cur[k]};
  });
  const at=new Date().toISOString();
  const why=pend.map(p=>p.j.name+" "+p.m.task+" ("+p.m.reason.toLowerCase()+")").join("; ");
  pend.forEach(p=>{ p.m.savedAt=at; p.m.caused=caused; });
  caused.forEach(c=>{ const jj=jobById(c.jobId); if(!jj) return;
    jj.shifted=jj.shifted||{}; jj.shifted[c.task]={was:c.was, now:c.now, at, why}; });
  return ()=>pend.forEach(p=>{ delete p.m.savedAt; delete p.m.caused; });
}
// the note shown on a calendar task: moved by hand, or shifted because of another move
function moveNote(jobId,task){
  const j=jobById(jobId); if(!j) return "";
  const hand=Object.values(j.moves||{}).filter(m=>m.task===task)
    .sort((a,b)=>String(a.at).localeCompare(String(b.at))).pop();
  if(hand && hand.kind!=="auto" && ((j.force||{})[task]===hand.to || (j.pins||{})[task]===hand.to))
    return "Moved by hand: "+hand.reason.toLowerCase()+(hand.detail?" ("+hand.detail+")":"");
  const s=(j.shifted||{})[task];
  if(s && startOf(jobId,task)===s.now) return "Shifted from "+fmt(s.was)+": "+s.why;
  return "";
}

function moveTask(jobId,task,date,why){
  const j=jobById(jobId); if(!j) return;
  if(why) recordMove(j,task,startOf(jobId,task),date,"date",why);
  j.force=j.force||{}; j.force[task]=date;
  clearLaterDates(j,task,date);
  recompute(); render();
  const row=App.sched.rows.find(r=>r.jobId===jobId&&r.task===task);
  const hit=overCrewDays().filter(o=>row&&row.days&&row.days.indexOf(o.date)>=0);
  if(hit.length) toast("Moved "+j.name+" "+task+". Over crew on "+hit.map(overText).join("; ")+
    ". Flagged. Approve to allow it.");
  else toast("Moved "+j.name+" "+task+" to "+fmt(date)+". Approve to save.");
}
function taskMenu(jobId,task){
  const j=jobById(jobId); if(!j) return;
  const row=App.sched.rows.find(r=>r.jobId===jobId&&r.task===task);
  const scrim=el("div","scrim"), m=el("div","modal");
  m.style.maxWidth="440px";

  h.appendChild(el("div","grow"));

  m.appendChild(h);

  b.appendChild(el("p","sub","Currently "+(row&&row.start?fmt(row.start)+" to "+fmt(row.finish):"not scheduled")+
    ", "+(row?row.men:"?")+" men."+((j.force||{})[task]?" You moved this one by hand.":"")));
  const mn=moveNote(jobId,task);
  if(mn) b.appendChild(el("p","mvnote",mn));
  const g=el("div","fgrid");
  const mk=(l,n)=>{const w=el("label","f"); w.appendChild(el("span",null,l)); w.appendChild(n); return w;};
  const di=el("input"); di.type="date"; di.value=(j.force||{})[task]||(row&&row.start)||todayStr();
  const pi=el("input"); pi.type="date"; pi.value=(j.pins||{})[task]||"";
  g.append(mk("Run it on this day",di), mk("Or just not before",pi));
  b.appendChild(g); m.appendChild(b);
  const f=el("div","mfoot");
  if((j.force||{})[task]||(j.pins||{})[task]){
    const r=el("button","btn","Let the scheduler decide");
    r.style.marginRight="auto";
    r.onclick=()=>askMoveReason(j.name+" "+task+": let the scheduler decide",why=>{
      recordMove(j,task,row&&row.start,null,"auto",why);
      if(j.force) delete j.force[task]; if(j.pins) delete j.pins[task];
      recompute(); scrim.remove(); render(); toast("Manual date cleared. Approve to save."); });
    f.appendChild(r);
  }
  const c=el("button","btn","Cancel"); c.onclick=()=>scrim.remove();
  const ok=el("button","btn primary","Apply");
  ok.onclick=()=>{
    if(di.value===((j.force||{})[task]||"") && pi.value===((j.pins||{})[task]||"")){ scrim.remove(); return; }
    const kind=di.value?"date":pi.value?"notbefore":"auto", to=di.value||pi.value||null;
    askMoveReason(j.name+" "+task+(kind==="date"?" to "+fmt(to):kind==="notbefore"?", not before "+fmt(to):
        ": let the scheduler decide"), why=>{
      recordMove(j,task,row&&row.start,to,kind,why);
      j.force=j.force||{}; j.pins=j.pins||{};
      if(di.value) j.force[task]=di.value; else delete j.force[task];
      if(pi.value) j.pins[task]=pi.value; else delete j.pins[task];
      recompute(); scrim.remove(); render(); toast("Updated. Review and approve to save.");
    });
  };
  f.append(c,ok); m.appendChild(f); scrim.appendChild(m);
  scrim.onclick=e=>{ if(e.target===scrim) scrim.remove(); };
  document.body.appendChild(scrim);
}
